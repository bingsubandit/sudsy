# The checks that name a newer Gradle or Android Gradle Plugin API, or are a matter of style: they
# need the version a project builds with (docs/ai/formatting/gradle.md).
gradle:
  lint:
    rules:
      no-apply-plugin: warn
      no-compile-sdk-version: warn
      no-build-tools-version: warn
      no-java-convention-compatibility: warn
      no-build-dir: warn
      no-floating-version: warn
      no-tasks-create: warn
