id: no-at-debug-tags
message: "`{@debug}` is a debugging aid; remove it before shipping"
description: Svelte's `no-at-debug-tags` (eslint-plugin-svelte). The tag pauses the browser's debugger when its values change.
example: '{@debug user}'
severity: warn
category: suspicious
rule: { kind: Mustache, regex: '^\{@debug\b' }
