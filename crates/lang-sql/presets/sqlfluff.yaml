# sqlfluff's default rules that Sudsy has, at warn, with their default options.
sql:
  lint:
    rules:
      count-star: warn
      distinct-group-by: warn
      duplicate-table-alias: warn
      else-null: warn
      expression-alias: warn
      function-case: warn
      identifier-case: warn
      implicit-alias: warn
      inner-join: warn
      keyword-case: warn
      literal-case: warn
      max-line-length:
        level: warn
        options:
          max: 80
          allow_non_breakable_words: false
      null-comparison: warn
      prefer-coalesce: warn
      right-join: warn
      detached-semicolon: warn
      self-alias: warn
      type-case: warn
      special-chars-in-identifier: warn
      keyword-identifier: warn
      needless-quotes: warn
      unknown-columns: warn
      unqualified-reference: warn
      inconsistent-reference: warn
      duplicate-column-alias: warn
      unused-alias: warn
      group-order-style: warn
      union-distinct: warn
      unused-cte: warn
