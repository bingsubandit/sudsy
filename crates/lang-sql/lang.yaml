vscode-languages: [sql]
extensions: [sql]
formatter: SqlFormatter
parse: parse::parse_file
families: "&[core_rules::unique::FAMILY, core_rules::token_case::FAMILY, core_rules::word_names::KEYWORD_NAME, core_rules::word_names::NEEDLESS_QUOTES, core_rules::query_scope::UNKNOWN_COLUMNS, core_rules::query_scope::REFERENCE_QUALIFICATION, core_rules::query_scope::REFERENCE_CONSISTENCY, core_rules::query_scope::UNIQUE_ALIASES, core_rules::query_scope::UNUSED_ALIAS, core_rules::detached_token::FAMILY, core_rules::clause_style::FAMILY]"
hooks: hooks::SqlHooks
options:
  - dialect:
      values: ["ansi", "postgres", "mysql", "tsql"]
      default: "ansi"
      doc: "The SQL dialect the file is parsed as."
  - line_width: 80
  - indent_style
  - indent_size: 4
  - final_newline: true
  - end_of_line
  - comma_position:
      values: ["trailing", "leading"]
      default: "trailing"
      doc: "Where a comma goes when a list is broken over lines: at the end of a line, or at the start of the next one."
  - alter_table_indent:
      default: false
      doc: "Indent the actions of `ALTER TABLE name` one level under the statement."
  - block_indent:
      default: false
      doc: "Indent the bodies of `BEGIN`, `LOOP`, `WHILE`, `REPEAT`, `IF` and `CASE` blocks one level under their opener."
  - keyword_case:
      values: ["consistent", "upper", "lower", "capitalise"]
      default: "consistent"
      doc: "Case of keywords: `consistent` follows the first one written (all that follow are brought to its case once one differs), the others set it."
  - identifier_case:
      values: ["consistent", "upper", "lower", "capitalise"]
      default: "consistent"
      doc: "Case of unquoted identifiers: `consistent` follows the first one written (all that follow are brought to its case once one differs), the others set it."
  - function_case:
      values: ["consistent", "upper", "lower", "capitalise"]
      default: "consistent"
      doc: "Case of function names: `consistent` follows the first one written (all that follow are brought to its case once one differs), the others set it."
  - literal_case:
      values: ["consistent", "upper", "lower", "capitalise"]
      default: "consistent"
      doc: "Case of `NULL`, `TRUE` and `FALSE`: `consistent` follows the first one written (all that follow are brought to its case once one differs), the others set it."
  - type_case:
      values: ["consistent", "upper", "lower", "capitalise"]
      default: "consistent"
      doc: "Case of data types: `consistent` follows the first one written (all that follow are brought to its case once one differs), the others set it."
presets: [sqlfluff]
