id: keyword-case
family: token-case
params: { option: keyword_case, message: "write `{name}` as `{fixed}`" }
description: >-
  Reports a keyword not in the case that the `policy` option sets. With `consistent` (the default)
  the first one written fixes the case (`upper`, `lower` or `capitalise`) and a later one that
  cannot be in it is reported; the other values name the case. The fix writes the word in that case.
why: >-
  Keywords in one case stand out from the names of tables and columns, and a file that mixes cases
  looks like it was merged from different sources.

  To fix, write the keyword in the case that the policy gives.
example: "SELECT a from t   # from is reported"
severity: off
category: style
fix-kind: safe
options:
  - { name: policy, type: string, default: consistent, choices: [consistent, upper, lower, capitalise], description: "The case the words must be in: `consistent` follows the first one written." }
---
id: identifier-case
family: token-case
params: { option: identifier_case, message: "write `{name}` as `{fixed}`" }
description: >-
  Reports an unquoted identifier not in the case that the `policy` option sets. With `consistent`
  (the default) the first one written fixes the case (`upper`, `lower` or `capitalise`) and a later
  one that cannot be in it is reported; the other values name the case. The fix writes the word in
  that case.
why: >-
  Most databases ignore the case of an unquoted name, so `Orders` and `orders` are one table, but a
  reader sees two. One case makes names easy to search for and to compare.

  To fix, write the name in the case that the policy gives.
example: "select A, b from t   # the later word is reported"
severity: off
category: style
fix-kind: safe
options:
  - { name: policy, type: string, default: consistent, choices: [consistent, upper, lower, capitalise], description: "The case the words must be in: `consistent` follows the first one written." }
---
id: function-case
family: token-case
params: { option: function_case, message: "write `{name}` as `{fixed}`" }
description: >-
  Reports a function name not in the case that the `policy` option sets. With `consistent` (the
  default) the first one written fixes the case (`upper`, `lower` or `capitalise`) and a later one
  that cannot be in it is reported; the other values name the case. The fix writes the word in that
  case.
why: >-
  Function names written in one case are easy to read and search for. Mixed case makes the same
  function look like two.

  To fix, write the name in the case that the policy gives.
example: "select COUNT(a), sum(b) from t   # the later word is reported"
severity: off
category: style
fix-kind: safe
options:
  - { name: policy, type: string, default: consistent, choices: [consistent, upper, lower, capitalise], description: "The case the words must be in: `consistent` follows the first one written." }
---
id: literal-case
family: token-case
params: { option: literal_case, message: "write `{name}` as `{fixed}`" }
description: >-
  Reports `NULL`, `TRUE` or `FALSE` not in the case that the `policy` option sets. With `consistent`
  (the default) the first one written fixes the case (`upper`, `lower` or `capitalise`) and a later
  one that cannot be in it is reported; the other values name the case. The fix writes the word in
  that case.
why: >-
  These literals are written as values in the query. Using one case for them keeps them uniform and
  easy to find.

  To fix, write the literal in the case that the policy gives.
example: "select NULL, true   # the later word is reported"
severity: off
category: style
fix-kind: safe
options:
  - { name: policy, type: string, default: consistent, choices: [consistent, upper, lower, capitalise], description: "The case the words must be in: `consistent` follows the first one written." }
---
id: type-case
family: token-case
params: { option: type_case, message: "write `{name}` as `{fixed}`" }
description: >-
  Reports a data type name not in the case that the `policy` option sets. With `consistent` (the
  default) the first one written fixes the case (`upper`, `lower` or `capitalise`) and a later one
  that cannot be in it is reported; the other values name the case. The fix writes the word in that
  case.
why: >-
  Type names in one case read as a group in a table definition or a cast, and a file that mixes
  cases looks inconsistent.

  To fix, write the type name in the case that the policy gives.
example: "select cast(a as INT), cast(b as text)   # the later word is reported"
severity: off
category: style
fix-kind: safe
options:
  - { name: policy, type: string, default: consistent, choices: [consistent, upper, lower, capitalise], description: "The case the words must be in: `consistent` follows the first one written." }
