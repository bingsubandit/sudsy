id: duplicate-table-alias
family: unique-names
params: { container: table-list, item: table-source, deep: "true", name: "alias/name:last|table/reference/name:last", fold: lower, strip: "\"`[]" }
message: this alias is already used by another table
description: >-
  Reports two tables of one `FROM` clause with the same alias, or the same name when there is no
  alias.
why: >-
  A column reference with that alias can mean either table. Databases reject the query as ambiguous,
  or the query reads the wrong one.

  To fix, give each table its own alias.
example: 'select a from t as x join u as x on x.a = x.b'
severity: warn
category: correctness
