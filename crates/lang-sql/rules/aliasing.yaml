id: expression-alias
message: give this expression an alias with AS
description: >-
  Reports a column of a `SELECT` list that is an expression (a function call, a literal, an
  operator, a `CASE`) with no alias. A column, `*`, a parenthesised expression and a `::` cast of a
  column are left alone; `CAST(a AS int)` is a function call and is reported.
why: >-
  Without an alias the name of the column is chosen by the database (`?column?`, `count`, `sum`,
  `expr1`), and it differs between databases and versions. Code that reads the result by name, and
  views built on the query, then depend on a generated name.

  To fix, add `AS name`.
example: 'select sum(a), b from t'
severity: off
category: style
rule:
  kind: SelectClauseElement
  not:
    child: { kind: AliasExpression }
  any:
    - child-token: [Number, String, WordLiteral]
    - child: { any: [{ kind: Function }, { kind: CaseExpression }] }
    - child:
        kind: Expression
        any:
          - child-token: [BinaryOperator, BinaryKeyword, Operator, Sign, Keyword, Number, String, WordLiteral]
          - child: { any: [{ kind: ComparisonOperator }, { kind: Function }, { kind: CaseExpression }] }
