id: rule-empty-line-before
family: blank-line-before
params: { tag: item, kind: Rule, block: declaration-block, always: multi-line, except: first-nested, ignore: after-comment, message: "expected {blank} before the rule" }
description: "A rule whose block spans lines needs a blank line before it, unless a comment is right before it; the first rule of a block takes none (`always-multi-line` with `first-nested` as the exception)."
example: "a {\n  top: 0;\n}\nb {\n  top: 0;\n}   # b is reported"
severity: off
category: style
---
id: at-rule-empty-line-before
family: blank-line-before
params: { tag: item, kind: AtRule, block: declaration-block, always: "true", except: "first-nested after-blockless-same-name", ignore: after-comment, skip: "@else", message: "expected {blank} before the at-rule" }
description: "An at-rule needs a blank line before it, unless a comment is right before it; the first at-rule of a block, and a blockless one right after a blockless one of the same name (`@import` lines), take none."
example: "a {}\n@media (a) {}   # reported"
severity: off
category: style
---
id: declaration-empty-line-before
family: blank-line-before
params: { tag: item, kind: Declaration, block: declaration-block, always: "true", except: "first-nested after-same-kind", ignore: "after-comment inside-single-line-block", skip: "--* $* @*", message: "expected {blank} before the declaration" }
description: "A declaration right after a rule or at-rule needs a blank line before it, one after another declaration or first in a block takes none; a comment right before it, a single-line block, custom properties and variables are left alone."
example: "a {\n  top: 0;\n\n  left: 0;\n}   # reported"
severity: off
category: style
---
id: custom-property-empty-line-before
family: blank-line-before
params: { tag: item, kind: Declaration, block: declaration-block, only: "--*", always: "true", except: "first-nested after-same-kind", ignore: "after-comment inside-single-line-block", message: "expected {blank} before the custom property" }
description: "A custom property needs a blank line before it, unless a comment is right before it or another custom property is; the first declaration of a block and those in a single-line block take none."
example: "a {\n  top: 0;\n  --x: 1;\n}   # reported"
severity: off
category: style
---
id: dollar-variable-empty-line-before
family: blank-line-before
params: { tag: item, kind: Declaration, block: declaration-block, only: "$*", always: "true", except: "first-nested after-same-kind", ignore: "after-comment inside-single-line-block", message: "expected {blank} before the $-variable" }
description: "A `$` variable declaration needs a blank line before it, unless a comment is right before it or another `$` variable is; the first statement of a block and those in a single-line block take none."
example: "a {\n  top: 0;\n  $x: 1;\n}   # reported"
severity: off
category: style
---
id: double-slash-comment-empty-line-before
family: blank-line-before
params: { token: LineComment, block: declaration-block, always: "true", except: first-nested, ignore: "after-comment inline directive", directive: "stylelint-", message: "expected {blank} before the comment" }
description: "A `//` comment on a line of its own needs a blank line before it, unless a comment is right before it, it comes first in a block, or it is a `stylelint-` directive."
example: "$a: 1;\n// note   # reported"
severity: off
category: style
---
id: comment-empty-line-before
family: blank-line-before
params: { token: Comment, block: declaration-block, always: "true", except: first-nested, ignore: "inline directive", directive: "stylelint-", message: "expected {blank} before the comment" }
description: "A `/* */` comment on a line of its own needs a blank line before it, unless it comes first in a block, shares a line with code or is a `stylelint-` directive; a `//` comment is another rule's."
example: "a {}\n/* note */   # reported"
severity: off
category: style
