id: no-empty-catch
message: 'the catch clause is empty: the error is swallowed'
description: >-
  Reports a `catch`, `except` or `rescue` clause whose body has no statement and no comment (`catch
  (e) { }`; in Python a lone `pass` counts as no statement). A comment belongs to the clause when it
  is on a later line than the clause starts on, after the clause's last token on that line, or
  indented deeper than the clause. With the option `comment_handles` off a comment does not count
  either. With `broad_only` only a clause that catches everything, or one of
  the exception types of the option `types`, is reported.
why: >-
  An empty handler swallows the error without a trace: the program goes on in a state it did not
  expect, and the failure shows up later far from its cause, with nothing in the logs.

  To fix, handle the error, log it, or let it propagate; if ignoring it is right, say why in a
  comment.
example: 'try { run(); } catch (e) { }'
severity: warn
category: suspicious
options:
  - { name: comment_handles, type: bool, default: true, description: A comment in the body counts as handling the error }
  - { name: broad_only, type: bool, default: false, description: Report only a clause that catches everything or a broad type }
  - { name: types, type: list, default: [], description: Types that count as broad }
rule:
  role: catch
  all:
    - not: { all: [{ option: comment_handles }, { commented: true }] }
  any:
    - fields: { body: { empty: true } }
    - all:
        - not: { option: comment_handles }
        - fields: { body: { bare: true } }
    - all:
        - { single: body }
        - fields: { body: { role: empty-statement } }
    - not: { fields: { body: { regex: '' } } }
  not:
    all:
      - { option: broad_only }
      - fields: { type: { regex: '' } }
      - not:
          items: { type: { any: [{ in-option: types }, { has: { in-option: types } }] } }
