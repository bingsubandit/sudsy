id: ambiguous-block-association
family: check
params: { check: ambiguous-block-association }
message: "the braces block binds to `{name}`, not to the outer call: add parentheses"
description: "A call without parentheses whose last argument is a call with a braces block (`expect { x }.to change { y }`, RuboCop Lint/AmbiguousBlockAssociation); also a `do` block that binds to the outer call while a block method such as `map` ends its arguments (`puts items.map do ... end`)."
example: "puts [1].map { |x| x }"
severity: off
category: suspicious
---
id: float-comparison
family: check
params: { check: float-comparison }
message: "comparing floats with `{name}` is unreliable: compare with a tolerance"
description: "`==`, `!=`, `eql?` or `equal?` with a float on one side (a literal, `to_f`, arithmetic on a float), and a float in a `when` (RuboCop Lint/FloatComparison); comparing with 0 or `nil` is fine."
example: "x == 0.1"
severity: warn
category: suspicious
---
id: boolean-symbol
family: check
params: { check: boolean-symbol }
message: "`{name}` is a symbol, not a boolean"
description: "The symbol `:true` or `:false`, which is probably meant to be the boolean (RuboCop Lint/BooleanSymbol)."
example: "x = :true"
severity: warn
category: suspicious
---
id: interpolation-check
family: check
params: { check: interpolation-check }
message: "a single-quoted string does not interpolate `#{...}`: use double quotes"
description: "A single-quoted string that holds `#{...}`, which would interpolate in double quotes (RuboCop Lint/InterpolationCheck)."
example: "x = 'a#{b}'"
severity: warn
category: suspicious
---
id: ineffective-access-modifier
family: check
params: { check: ineffective-access-modifier }
message: "`{name}` does not make singleton methods {name}: use `private_class_method` or `class << self`"
description: "`private` or `protected` before `def self.name`, which it does not affect (RuboCop Lint/IneffectiveAccessModifier); `private_class_method :name` in the class makes the method private on purpose."
example: "class A\n  private\n  def self.f; end\nend"
severity: warn
category: correctness
---
id: constant-definition-in-block
family: check
params: { check: constant-definition-in-block }
message: "a constant or class defined in a block belongs to the enclosing scope, not to the block"
description: "A constant, class or module defined directly in a block (RuboCop Lint/ConstantDefinitionInBlock); `enums` blocks (Sorbet) are allowed."
example: "describe 'x' do\n  FOO = 1\nend"
severity: off
category: suspicious
---
id: missing-super
family: check
params: { check: missing-super }
message: "call `super` to invoke the callback `{name}` defined in the parent class"
description: "`initialize` of a class with a parent other than Object, and the lifecycle callbacks `inherited` and `method_added`, that do not call `super` (RuboCop Lint/MissingSuper)."
example: "class A < B\n  def initialize; end\nend"
severity: off
category: suspicious
---
id: unknown-cop-name
family: check
params: { check: unknown-cop-name }
message: "unknown cop `{name}` in a RuboCop directive"
description: "A `# rubocop:disable Department/Cop` comment whose department RuboCop does not have (an extension such as Rails or RSpec that the project does not load) (RuboCop Lint/CopDirectiveSyntax)."
example: "# rubocop:disable Rails/Foo"
severity: off
category: suspicious
---
id: useless-access-modifier
family: check
params: { check: useless-access-modifier }
message: "useless `{name}` access modifier"
description: "A bare `private`, `protected`, `public` or `module_function` that repeats the visibility already in force, or is followed by no method definition (RuboCop Lint/UselessAccessModifier)."
example: "class A\n  private\nend"
severity: warn
category: suspicious
---
id: raise-exception
family: check
params: { check: raise-exception }
message: "raising `Exception` is rescued only by `rescue Exception`: raise `StandardError` or a subclass"
description: "Raising `Exception` itself (`raise Exception`, `raise Exception.new`), which a plain `rescue` does not catch (RuboCop Lint/RaiseException)."
example: 'raise Exception, "m"'
severity: off
category: suspicious
---
id: parentheses-as-grouped-expression
family: check
params: { check: parentheses-as-grouped-expression }
message: "`{name}` is read as a grouped expression, not as the arguments: remove the space before it"
description: "A space between a method name and the `(` of its only argument (`puts (1 + 2) * 3`) (RuboCop Lint/ParenthesesAsGroupedExpression)."
example: "puts (x)"
severity: off
category: suspicious
---
id: hash-compare-by-identity
family: check
params: { check: hash-compare-by-identity }
message: "use `Hash#compare_by_identity` instead of `object_id` as the key"
description: "A hash looked up with `x.object_id` as the key (`h[x.object_id]`, `key?`, `fetch`) (RuboCop Lint/HashCompareByIdentity)."
example: "h[x.object_id]"
severity: off
category: suspicious
---
id: useless-times
family: check
params: { check: useless-times }
message: "the block runs at most once: do not call `times`"
description: "`0.times` and `1.times` with a block (RuboCop Lint/UselessTimes)."
example: "1.times { x }"
severity: off
category: suspicious
---
id: struct-new-override
family: check
params: { check: struct-new-override }
message: "`{name}` replaces a method of `Struct`"
description: "A `Struct.new` member that has the name of a method of `Struct` (`:hash`, `:size`, `:count`) (RuboCop Lint/StructNewOverride)."
example: "Struct.new(:hash)"
severity: warn
category: suspicious
---
id: redundant-string-coercion
family: check
params: { check: redundant-string-coercion }
message: "`to_s` is redundant here: the value is converted anyway"
description: "`to_s` on the last expression of a `#{...}` and on an argument of `puts`, `print` or `warn` (RuboCop Lint/RedundantStringCoercion)."
example: '"#{x.to_s}"'
severity: off
category: suspicious
---
id: literal-in-interpolation
family: check
params: { check: literal-in-interpolation }
message: "a literal in `#{...}` belongs in the string itself"
description: "A number, symbol, `true`, `false`, `nil` or string literal as the whole content of a `#{...}` (RuboCop Lint/LiteralInInterpolation)."
example: '"a #{1}"'
severity: off
category: suspicious
---
id: mixed-regexp-capture-types
family: check
params: { check: mixed-regexp-capture-types }
message: "a regexp with named captures does not capture the numbered groups"
description: "A regexp literal that has both `(?<name>...)` and plain `(...)` groups (RuboCop Lint/MixedRegexpCaptureTypes)."
example: "/(?<a>x)(y)/"
severity: warn
category: suspicious
---
id: binary-operator-with-identical-operands
family: check
params: { check: binary-operator-with-identical-operands }
message: "binary operator `{name}` has identical operands"
description: "`x == x`, `a && a` and other comparison, logical and bitwise operators whose two sides are the same code (RuboCop Lint/BinaryOperatorWithIdenticalOperands)."
example: "x == x"
severity: warn
category: suspicious
---
id: empty-when
family: check
params: { check: empty-when }
message: "a `when` branch has no body"
description: "A `when` with no statements and no comment (RuboCop Lint/EmptyWhen)."
example: "case x\nwhen 1\nend"
severity: off
category: suspicious
---
id: post-condition-loop
family: check
params: { check: post-condition-loop }
message: "`begin ... end {name}` runs the body once before the test: use `loop do ... break` instead"
description: "A `begin ... end while cond` or `until` loop, which behaves unlike the other loops (RuboCop Lint/Loop)."
example: "begin\n  x\nend while y"
severity: off
category: suspicious
---
id: inherit-exception
family: check
params: { check: inherit-exception }
message: "inheriting from `Exception` makes the class hard to rescue: inherit from `StandardError`"
description: "A class that inherits `Exception` directly (`class A < Exception`, `Class.new(Exception)`) (RuboCop Lint/InheritException)."
example: "class A < Exception; end"
severity: off
category: suspicious
---
id: useless-method-definition
family: check
params: { check: useless-method-definition }
message: "the method only calls `super`: remove it"
description: "A method whose whole body is a bare `super` (RuboCop Lint/UselessMethodDefinition)."
example: "def f(a)\n  super\nend"
severity: off
category: suspicious
---
id: return-in-void-context
family: check
params: { check: return-in-void-context }
message: "do not return a value in `{name}`"
description: "`return value` in `initialize` or a setter method, whose result is ignored (RuboCop Lint/ReturnInVoidContext)."
example: "def initialize\n  return 1\nend"
severity: warn
category: suspicious
---
id: no-assignment-in-logical-condition
message: an assignment is the right operand of a condition (was `==` meant?)
description: >-
  `if a && b = c`: the condition is a logical operation whose right operand is an assignment not
  wrapped in parentheses (RuboCop Lint/AssignmentInCondition); a plain assignment condition is
  `no-assignment-in-condition`.
example: 'if a && b = c; end'
severity: warn
category: suspicious
report-on: field condition
rule:
  role: [conditional, loop]
  fields:
    condition: { role: binary, operator: logical, fields: { right: { role: assignment } } }
