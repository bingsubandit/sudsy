# RuboCop default Lint cops that Sudsy has, at warn.
ruby:
  lint:
    rules:
      ambiguous-block-association: warn
      binary-operator-with-identical-operands: warn
      boolean-symbol: warn
      constant-definition-in-block: warn
      empty-when: warn
      float-comparison: warn
      hash-compare-by-identity: warn
      ineffective-access-modifier: warn
      inherit-exception: warn
      interpolation-check: warn
      literal-in-interpolation: warn
      missing-super: warn
      mixed-regexp-capture-types: warn
      no-assignment-in-condition: warn
      no-assignment-in-logical-condition: warn
      parentheses-as-grouped-expression: warn
      post-condition-loop: warn
      raise-exception: warn
      redundant-string-coercion: warn
      no-broad-catch: warn
      return-in-void-context: warn
      no-self-assign: warn
      struct-new-override: warn
      no-empty-catch: warn
      underscore-prefixed-variable-used: warn
      unknown-cop-name: warn
      unused-block-argument: warn
      unused-local-variable: warn
      unused-method-argument: warn
      useless-access-modifier: warn
      useless-method-definition: warn
      useless-times: warn
