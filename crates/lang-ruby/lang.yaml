vscode-languages: [ruby]
extensions: [rb, rake, gemspec, ru]
file-names: [Gemfile, Rakefile, Guardfile, Capfile]
formatter: FORMAT
format-rows:
  source-indent: true
  exact-end: [Data]
  keep-comment-gap: true
  blanks:
    statements: [Statements]
    guard: [If, Unless]
    branch: [Else, If, Unless]
    directives: ["rubocop:"]
    jump: [Return, Break, Next, Redo, Retry]
    jump-words: [raise, fail, throw]
    modifiers: [private, protected, public, module_function]
    magic: [frozen_string_literal, encoding, coding, warn_indent, shareable_constant_value]
    body: [Class, Module, Def, Block]
    defs: [Def, Class, Module]
  indents:
    statements: [Statements]
    frames: [Def, Class, Module, SingletonClass, Block, Lambda, Begin]
    attached: [Block]
    leaders: [Dot]
    chains: [Call]
    pairs: [Assoc]
    operations: [And, Or]
    conditions: [If, Unless, While, Until]
    opaque: [Arguments, Array, Parentheses]
    keyword-frames: [If, Unless, While, Until, Case, When, Else, Rescue, Ensure]
    branches: [Else, Rescue, Ensure, When]
    closers: [end, "}"]
    heredoc-openers: [DocStart]
    heredoc-bodies: [HeredocBody]
    heredoc-wrappers: [Arguments]
    open-brackets: [LParen, LBracket, LBrace, EmbBegin]
    close-brackets: [RParen, RBracket, RBrace]
    elements: [Arguments, Array, Hash]
parse: adapter::parse_file
options:
  - indent_size: 2
  - line_width: 120
  - indent_style
  - final_newline: true
  - max_blank_lines: [1, "Largest number of blank lines kept between lines (RuboCop Layout/EmptyLines)."]
  - end_of_line
families: rules::FAMILIES
presets: [rubocop]
