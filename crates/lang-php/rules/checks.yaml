id: unsafe-new-static
message: "`new static` can build a subclass with another constructor: make the class or its constructor final"
description: "`new static` in a class that is not final and has no final or abstract constructor of its own (PHPStan new.static). A constructor or final parent in another file cannot be seen; the `@phpstan-consistent-constructor` tag of the class itself is."
example: "class A { function make() { return new static(); } }"
severity: off
category: suspicious
rule:
  kind: Instantiation
  regex: '^new\s+static(\s*\(|$)'
  inside:
    all:
      - any: [{ kind: Class }, { kind: Trait }]
      - not:
          any:
            - regex: '(?s)^(?:#\[.*?\]\s*)*(?:(?:abstract|readonly)\s+)*final\b'
            - doc: '@phpstan-consistent-constructor'
            - has:
                kind: Method
                regex: '(?s)^(?:#\[.*?\]\s*)*(?:(?:public|protected|private|static)\s+)*(?:final|abstract)\s+(?:(?:public|protected|private)\s+)*function\s+__construct\b'
report-on: first-token
---
id: no-inner-function
message: "A named function declared inside a function or method only exists after the outer one has run: declare it at the top level or use a closure"
description: "A `function name() {}` statement in the body of a function, method or closure (PHPStan function.inner)."
example: "function a() { function b() {} }"
severity: off
category: suspicious
rule:
  kind: Function
  inside: { any: [{ kind: Function }, { kind: Method }, { kind: Closure }, { kind: ArrowFunction }] }
report-on: first-token
---
id: implicit-nullable-parameter
message: "The type is nullable only through the `null` default: write `?` before the type (deprecated in PHP 8.4)"
description: "A parameter with a type that does not allow `null` and a `null` default (PHPStan parameter.implicitlyNullable)."
example: "function f(int $a = null) {}"
severity: off
category: suspicious
rule:
  kind: FunctionLikeParameter
  regex: '(?is)^(?:#\[.*?\]\s*)*(?:(?:public|protected|private|readonly)\s+)*(?<TYPE>[^$=]*?[^$=\s&.])\s*(?:&\s*)?(?:\.\.\.\s*)?\$\w+\s*=\s*null$'
constraints:
  TYPE: { not-regex: '(?i)[?#]|\bnull\b|^mixed$|^(?:(?:public|protected|private|readonly)\s*)+$' }
---
id: no-unset-hookable-property
message: "`unset` of `$this->${NAME}`: a subclass may give the property a hook, which cannot be unset"
description: "`unset($this->name)` of a property that the class declares and that a subclass could override with a property hook (PHP 8.4): the class is not final and the property is neither private, final, static nor readonly (PHPStan unset.possiblyHookedProperty)."
example: "class A { public $a; function f() { unset($this->a); } }"
severity: off
category: suspicious
rule:
  kind: PropertyAccess
  regex: '^\$this\s*->\s*(?<NAME>\w+)$'
  parent: { kind: Unset }
  inside:
    all:
      - any: [{ kind: Class }, { kind: Trait }]
      - not: { regex: '(?s)^(?:#\[.*?\]\s*)*(?:(?:abstract|readonly)\s+)*final\b' }
      - has:
          kind: PlainProperty
          regex: '[$]${NAME}\b'
          not: { regex: '(?s)^[^$]*\b(?:private|final|readonly|static)\b' }
---
id: void-result-used
message: "The result of `${NAME}()` is used, but the method is declared void"
description: "`return` or an assignment of a call of `$this->name()`, `self::name()` or `static::name()` where the class, trait or enum of the file declares `name` as `: void` or `@return void` (PHPStan method.void, staticMethod.void). A method of a parent or trait in another file is not seen."
example: "class A { function f(): void {} function g() { return $this->f(); } }"
severity: off
category: correctness
rule:
  any: [{ kind: MethodCall }, { kind: StaticMethodCall }]
  regex: '^(?:\$this\s*->|(?:self|static)\s*::)\s*(?<NAME>\w+)\s*\('
  parent:
    any:
      - kind: Return
      - kind: Assignment
      - { kind: Conditional, parent: { kind: Return } }
  inside:
    all:
      - any: [{ kind: Class }, { kind: Trait }, { kind: Enum }]
      - has:
          kind: Method
          any:
            - regex: '(?s)\bfunction\s+&?${NAME}\s*\([^{;]*\)\s*:\s*void\b'
            - all:
                - doc: '@return\s+void(?:\s|$)'
                - regex: '(?s)\bfunction\s+&?${NAME}\s*\([^{;]*\)\s*(?:\{|;|$)'
report-on: first-token
---
id: readonly-property-never-assigned
message: "The readonly property `$${NAME}` is not assigned in the constructor: the class has none that does"
description: "A `readonly` property of a class that uses no trait and has no constructor assigning `$this->name` anywhere in its body (PHPStan property.uninitializedReadonly). An assignment on only some paths of a constructor is not seen."
example: "class A { public readonly int $a; }"
severity: off
category: correctness
rule:
  kind: PlainProperty
  regex: '(?s)^[^$]*\breadonly\b[^$]*[$](?<NAME>\w+)'
  inside:
    all:
      - kind: Class
      - not: { has: { kind: TraitUse } }
      - not:
          has:
            kind: Method
            regex: '(?s)\bfunction\s+__construct\b.*\$this\s*->\s*${NAME}\s*(?:=[^=]|[,\]])'
report-on: first-token
