id: class-not-found
family: name-resolves
params: { message: "Class {name} not found." }
description: >-
  Reports a class, interface or trait name written where a class is used (`new`, a type of a
  parameter, return value or property, `catch`, `instanceof`, the class of a static call or static
  property) that no file declares. The name is looked up in the project's files and in the files
  Composer's autoload rules (`composer.json` and the installed packages) name for it. A name outside
  every autoload prefix, or one that a conditional or run-time declaration may declare, is not
  reported.
why: >-
  A class that cannot be found fails at run time with an `Error` the moment the line runs, and a
  type that cannot be found makes the check of the argument or the return value fail.

  To fix, install the package that holds the class, correct the name or the `use` import, or
  declare the class.
example: "namespace App; class A { function f(Missing $x) {} }"
severity: off
category: correctness
