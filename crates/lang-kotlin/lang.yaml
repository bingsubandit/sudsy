vscode-languages: [kotlin]
extensions: [kt, kts]
formatter: KotlinFormatter
families: "&[core_rules::format_diff::FAMILY, core_rules::multiline_start::FAMILY, core_rules::naming::FAMILY, core_rules::file_name::FAMILY]"
parse: adapter::parse_file
limits: {stack: 256, bytes: 16, depth: 2000, run: "!-+@", tagged: ["@", 12]}
options:
  - indent_size: 4
  - line_width: 140
  - indent_style
  - final_newline: true
  - end_of_line
  - trailing_commas:
      values: ["never", "multiline"]
      default: "multiline"
      doc: "Trailing comma after the last argument or parameter of a call or declaration that is laid out on several lines: `multiline` adds one, `never` removes it."
  - function_signature_wrap_min_parameters:
      range: [1, 1000]
      default: 2
      doc: "A function or constructor with at least this many parameters puts each on a line of its own, even when the signature fits."
  - class_signature_wrap_min_parameters:
      range: [1, 1000]
      default: 1
      doc: "A class with at least this many primary-constructor parameters puts each on a line of its own, even when the signature fits."
  - class_signature_wrap_min_supertypes:
      range: [1, 1000]
      default: 2
      doc: "A class or object with at least this many supertypes puts each on a line of its own."
  - assignment_layout: ["multiline"]
  - assignment_conditional: ["always"]
  - assignment_indent: [1]
  - assignment_left_min_parameters: [2]
  - assignment_left_unless_kinds: [["Colon"]]
  - assignment_keep_break_kinds: [["Property", "BinaryExpression", "PropertyAccessor"]]
  - annotation_inline: ["single"]
  - semicolon_keep_parents: [["ClassBody", "EnumEntry"]]
  - trailing_comma_before: [["WhenEntry", "->"]]
  - trailing_comma_last_entry: [["ClassBody", "EnumEntry"]]
  - single_line_body_kinds: [["EnumEntry"]]
  - raw_string_calls: [["trimIndent", "trimMargin"]]
  - open_comment_inside_parents: [["Try", "Catch", "Finally"]]
  - ctor_own_line_kinds: [["AnnotationEntry"]]
  - wrapped_body_indent_words: [["constructor"]]
  - comment_trim_lines: [true]
  - single_block_comment_as_line: [true]
  - comment_reindent_lines: [true]
  - comment_space_exempt: [["//region", "//endregion", "//noinspection", "//language="]]
  - format_rules: [["curly", "redundant-return-type", "comment-space"]]
  - redundant_return_types: [["Unit"]]
  - curly_style: ["chain"]
  - settle_keywords: [["if", "else", "for", "while"]]
  - signature_wrap_annotated: [true]
  - annotation_source_kinds: [["ValueParameter"]]
  - member_chain_style: ["wrapped"]
  - member_chain_min_calls: [2]
  - member_chain_force_links: [4]
  - member_chain_indent: [1]
presets: [ktlint]
