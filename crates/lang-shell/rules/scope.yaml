id: unused-variable
family: scope
params: { check: unused-local-variable }
message: "`{name}` is assigned but never used in the file (export it if another program reads it)"
description: >-
  Reports a variable that the file assigns and never reads, in an expansion, an arithmetic
  expression or an operand of `read`, `export` and the like. A name that is exported, set in the
  environment of a command (`A=1 cmd`) or that steers the shell (`IFS`, `PATH`, `PS1`) is not
  reported.
example: 'unused=1'
severity: off
category: cleanup
---
id: unassigned-variable
family: scope
params: { check: undefined-variable }
message: "`{name}` is referenced but not assigned"
description: >-
  Reports a lower case variable that the file reads and never assigns, reads with `read`, `getopts`,
  `local` or a `for` loop, or guards with a default (`${name:-x}`). Names with an upper case letter
  are left alone: they are the environment's.
why: >-
  A variable that is read and never set is usually a misspelling of another one, and it expands to
  nothing without an error, so `rm -rf "$dir/"*` with `dir` misspelled becomes `rm -rf /*`.

  To fix, correct the name, or assign the variable.
example: 'echo "$name"'
severity: off
category: correctness
