id: redefines-builtin-id
family: scope
params: { check: redefines-builtin }
message: "`{name}` shadows a Python builtin"
description: >-
  Reports a variable, function, class, parameter or import named like a Python builtin (`list`, `id`,
  `type` and so on). The options `allow` and `kinds` change what is checked.
example: "list = [1]\ndef f(id): pass"
severity: off
category: suspicious
options:
  - { name: allow, type: list, default: [], description: Names that may be declared. }
  - { name: kinds, type: list, choices: [variable, parameter, function, class, import, type], default: [], description: "The declarations that are checked (empty: all)." }
  - { name: except_parents, type: list, default: [], description: "Grammar kinds whose direct declarations are left out." }
