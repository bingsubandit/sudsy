id: unused-import
family: scope
params: { check: unused-import }
message: "`{name}` imported but unused"
description: "An import that nothing in its scope reads and that `__all__` does not name (a redundant alias `import a as a` is a re-export)."
example: "import os"
severity: off
category: suspicious
---
id: redeclared-variable
family: scope
params: { check: redeclared-variable }
message: "redefinition of unused `{name}`"
description: "A function, class or import redefined, or an import covered by a name of a function, before anything read the first."
example: "import os\nimport os"
severity: warn
category: suspicious
---
id: undefined-variable
family: scope
params: { check: undefined-variable }
message: "undefined name `{name}`"
description: "A name that no scope around the read binds and that is not a builtin (not when a `try` handles `NameError`)."
example: "print(x)"
severity: warn
category: correctness
---
id: unused-variable
family: scope
params: { check: unused-variable }
message: "local variable `{name}` is assigned to but never used"
description: "A local variable assigned and never read, or an exception named by `except ... as` and never read (not tuple unpacking, not `_` names, not in functions that call `locals()`)."
example: "def f():\n    x = 1"
severity: off
category: suspicious
---
id: unused-annotation
family: scope
params: { check: unused-variable, mode: annotation }
message: "local variable `{name}` is annotated but never used"
description: "A local variable annotated without a value and never read."
example: "def f():\n    x: int"
severity: off
category: suspicious
---
id: undefined-export
family: scope
params: { check: undefined-export }
message: "undefined name `{name}` in `__all__`"
description: "A name in `__all__` that the module does not bind."
example: "__all__ = [\"x\"]"
severity: warn
category: correctness
---
id: use-before-define
family: scope
params: { check: use-before-define }
message: "local variable `{name}` referenced before assignment"
description: "A name read in a function before the function assigns it, while an enclosing scope binds it too."
example: "x = 1\ndef f():\n    print(x)\n    x = 2"
severity: warn
category: correctness
---
id: shadowed-variable
family: scope
params: { check: shadowed-variable }
message: "`{name}` shadows an import or an argument"
description: "A `for` variable with the name of an import, and a `for` variable, `with ... as` name or `except ... as` name that is also an argument of its function (and has not been bound since)."
example: "import os\nfor os in []:\n    pass"
severity: warn
category: suspicious
---
id: undefined-local-with-import-star
family: check
params: { check: undefined-local-with-import-star }
message: "`from {name} import *` used; unable to detect undefined names"
description: "A star import."
example: "from os import *"
severity: off
category: suspicious
---
id: late-future-import
family: check
params: { check: late-future-import }
message: "`from __future__` imports must occur at the beginning of the file"
description: "A `from __future__` import after other statements."
example: "import os\nfrom __future__ import annotations"
severity: warn
category: correctness
---
id: undefined-local-with-import-star-usage
family: scope
params: { check: undefined-variable, mode: star-usage }
message: "`{name}` may be undefined, or defined from star imports"
description: "A name that no scope binds in a file that has a star import."
example: "from os import *\nprint(x)"
severity: off
category: suspicious
---
id: undefined-local-with-nested-import-star-usage
family: check
params: { check: undefined-local-with-nested-import-star-usage }
message: "`from {name} import *` only allowed at module level"
description: "A star import in a function or class."
example: "def f():\n    from os import *"
severity: warn
category: correctness
---
id: future-feature-not-defined
family: check
params: { check: future-feature-not-defined }
message: "future feature `{name}` is not defined"
description: "A name imported from `__future__` that the module does not have."
example: "from __future__ import nope"
severity: warn
category: correctness
---
id: multiple-starred-expressions
family: check
params: { check: multiple-starred-expressions }
message: "two starred expressions in assignment"
description: "An assignment target with two starred names."
example: "a, *b, *c = x"
severity: warn
category: correctness
---
id: invalid-print-syntax
family: check
params: { check: invalid-print-syntax }
message: "use of `>>` is invalid with the `print` function"
description: "`print >> file, ...` of Python 2."
example: "print >> f, x"
severity: warn
category: correctness
---
id: break-outside-loop
family: check
params: { check: break-outside-loop }
message: "`break` outside loop"
description: "A `break` that no loop of its function or class contains."
example: "break"
severity: warn
category: correctness
---
id: continue-outside-loop
family: check
params: { check: continue-outside-loop }
message: "`continue` not properly in loop"
description: "A `continue` that no loop of its function or class contains."
example: "continue"
severity: warn
category: correctness
---
id: yield-outside-function
family: check
params: { check: yield-outside-function }
message: "`yield` or `await` outside of a function"
description: "A `yield`, `yield from` or `await` outside a function."
example: "yield 1"
severity: warn
category: correctness
---
id: return-outside-function
family: check
params: { check: return-outside-function }
message: "`return` outside of a function"
description: "A `return` that is not inside a function."
example: "return 1"
severity: warn
category: correctness
---
id: default-except-not-last
family: check
params: { check: default-except-not-last }
message: "an `except:` block must be the last exception handler"
description: "A bare `except:` followed by another handler."
example: "try:\n    pass\nexcept:\n    pass\nexcept ValueError:\n    pass"
severity: warn
category: correctness
---
id: forward-annotation-syntax-error
family: check
params: { check: forward-annotation-syntax-error }
message: "syntax error in forward annotation: {name}"
description: "A quoted annotation that is not an expression."
example: "x: \"1 +\" = 1"
severity: warn
category: correctness
---
id: type-comparison
family: check
params: { check: type-comparison }
message: "compare types with `is` and `is not`, or use `isinstance`"
description: "A comparison with `==` or `!=` where a side is `type(x)` or a builtin class (the builtin, not a name that shadows it)."
example: "type(a) == type(b)"
severity: warn
category: suspicious
---
id: invalid-syntax
family: check
params: { check: invalid-syntax }
message: "{name}"
description: "Code that Python rejects when it compiles the file, though the grammar allows it (a duplicate parameter, `nonlocal` at module level, `await` in a sync function, ...)."
example: "def f(a, a):\n    pass"
severity: error
category: correctness
---
id: module-import-not-at-top-of-file
family: check
params: { check: module-import-not-at-top-of-file }
message: "module level import not at top of file"
description: "An import at module level after code (docstrings, `__all__`, blocks, and `sys.path` or `os.environ` setup are not code)."
example: "x = 1\nimport os"
severity: off
category: style
---
id: multiple-statements-on-one-line-colon
family: check
params: { check: multiple-statements-on-one-line-colon }
message: "put the body of the statement on its own line"
description: "A compound statement whose body starts on the line of its colon (not `def`, not a lone `...`)."
example: "if x: pass"
severity: off
category: style
---
id: multiple-statements-on-one-line-semicolon
family: check
params: { check: multiple-statements-on-one-line-semicolon }
message: "put each statement on a line of its own"
description: "Statements joined by `;`."
example: "a = 1; b = 2"
severity: off
category: style
---
id: useless-semicolon
family: check
params: { check: useless-semicolon }
message: "remove the semicolon that ends the statement"
description: "A `;` at the end of a line."
example: "a = 1;"
severity: off
category: style
---
id: ambiguous-variable-name
family: check
params: { check: ambiguous-variable-name }
message: "ambiguous variable name `{name}`"
description: "A variable, parameter or `global` name that is `l`, `O` or `I`."
example: "l = 1"
severity: off
category: style
---
id: ambiguous-class-name
family: check
params: { check: ambiguous-class-name }
message: "ambiguous class name `{name}`"
description: "A class named `l`, `O` or `I`."
example: "class l:\n    pass"
severity: off
category: style
---
id: ambiguous-function-name
family: check
params: { check: ambiguous-function-name }
message: "ambiguous function name `{name}`"
description: "A function named `l`, `O` or `I`."
example: "def l():\n    pass"
severity: off
category: style
---
id: is-literal
family: check
params: { check: is-literal }
message: "use `==` to compare with a literal, not `is`"
description: "An identity test (`is`, `is not`) with a string, bytes or number literal, a list, set, dict or comprehension, or a tuple of constants."
example: 'x is "a"'
severity: warn
category: correctness
---
id: f-string-missing-placeholders
family: check
params: { check: f-string-missing-placeholders }
message: "this f-string has no placeholders; drop the `f`"
description: "An f-string with no replacement field in any of its parts."
example: 'f"text"'
severity: warn
category: suspicious
---
id: bare-except
family: check
params: { check: bare-except }
message: "name the exceptions to catch; a bare `except` also catches `SystemExit` and `KeyboardInterrupt`"
description: "An `except` clause without an exception type, unless its body has a bare `raise` of its own."
example: "try:\n    pass\nexcept:\n    pass"
severity: warn
category: suspicious
---
id: lambda-assignment
family: check
params: { check: lambda-assignment }
message: "define a function with `def` instead of assigning a lambda"
description: "A lambda assigned to a single name (an annotated one also in a class body is left alone)."
example: 'f = lambda x: x'
severity: off
category: style
---
id: mutable-argument-default
family: check
params: { check: mutable-argument-default }
message: "do not use a mutable value as an argument default: it is shared by every call"
description: "A parameter whose default is a list, dict or set (literal, comprehension or `list()`, `dict()`, `set()`, `collections.deque()`, ...), unless its annotation is an immutable type."
example: "def f(a=[]):\n    pass"
severity: warn
category: suspicious
---
id: get-attr-with-constant
family: check
params: { check: get-attr-with-constant }
message: "`getattr` with a constant attribute is no safer than `x.attr`"
description: "`getattr(x, \"name\")` with a literal name that is an identifier (two arguments)."
example: "getattr(x, \"name\")"
severity: off
category: style
---
id: set-attr-with-constant
family: check
params: { check: set-attr-with-constant }
message: "`setattr` with a constant attribute is no safer than `x.attr = v`"
description: "A statement `setattr(x, \"name\", v)` with a literal name that is an identifier."
example: "setattr(x, \"name\", 1)"
severity: off
category: style
---
id: assert-false
family: check
params: { check: assert-false }
message: "do not `assert False`: `python -O` removes it, raise `AssertionError()`"
description: "An `assert` whose test is the literal `False`."
example: "assert False"
severity: warn
category: suspicious
---
id: redundant-tuple-in-exception-handler
family: check
params: { check: redundant-tuple-in-exception-handler }
message: "a one-element tuple is redundant in an exception handler"
description: "An `except` clause that names a tuple of one exception."
example: "try:\n    pass\nexcept (ValueError,):\n    pass"
severity: warn
category: style
---
id: raise-without-from-inside-except
family: check
params: { check: raise-without-from-inside-except }
message: "inside an `{name}` clause, raise with `from err` or `from None`"
description: "A `raise` of an exception inside an `except` clause (nested `if`, loops, `with` and `match` included; `try`, functions and classes not) without `from`, unless it raises the name the clause bound."
example: "try:\n    pass\nexcept OSError:\n    raise ValueError"
severity: off
category: suspicious
---
id: zip-without-explicit-strict
family: check
params: { check: zip-without-explicit-strict }
message: "`zip()` without an explicit `strict=`"
description: "A call of `zip` with several arguments (or a starred one) and no `strict` keyword, for Python 3.10 and later."
example: "zip(a, b)"
severity: off
category: suspicious
---
id: print
family: check
params: { check: print }
message: "`print` found"
description: "A call of the builtin `print` without a `file` argument (or with `file=None`)."
example: "print(1)"
severity: off
category: style
---
id: pprint
family: check
params: { check: pprint }
message: "`pprint` found"
description: "A call of `pprint.pprint`."
example: "import pprint\npprint.pprint(1)"
severity: off
category: style
---
id: useless-object-inheritance
family: check
params: { check: useless-object-inheritance }
message: "class `{name}` inherits from `object`, which every class does"
description: "A class with the builtin `object` as a base."
example: "class A(object):\n    pass"
severity: off
category: style
---
id: os-error-alias
family: check
params: { check: os-error-alias }
message: "`{name}` is an alias of `OSError`"
description: "`EnvironmentError`, `IOError`, `WindowsError`, `mmap.error`, `os.error`, `select.error` or `socket.error` in an `except` clause or a `raise`."
example: "try:\n    pass\nexcept IOError:\n    pass"
severity: off
category: style
---
id: unicode-literal
family: check
params: { check: unicode-literal }
message: "remove the `u` prefix: strings are unicode"
description: "A string with the `u` prefix."
example: "x = u\"a\""
severity: off
category: style
---
id: in-dict-keys
family: check
params: { check: in-dict-keys }
message: "use `key in dict` instead of `key in dict.keys()`"
description: "A membership test, `for` or comprehension over `.keys()` with no arguments."
example: "x = k in d.keys()"
severity: off
category: style
---
id: negate-equal-op
family: check
params: { check: negate-equal-op }
message: "use `a != b` instead of `not a == b`"
description: "`not` applied to a comparison with `==`."
example: "x = not a == b"
severity: off
category: style
---
id: negate-not-equal-op
family: check
params: { check: negate-not-equal-op }
message: "use `a == b` instead of `not a != b`"
description: "`not` applied to a comparison with `!=`."
example: "x = not a != b"
severity: off
category: style
---
id: double-negation
family: check
params: { check: double-negation }
message: "`not not a` is `a`"
description: "`not` applied to `not`."
example: "x = not not a"
severity: off
category: style
---
id: if-expr-with-true-false
family: check
params: { check: if-expr-with-true-false }
message: "use `bool(...)` instead of `True if ... else False`"
description: "A conditional expression with `True` and `False` arms."
example: "x = True if a else False"
severity: off
category: style
---
id: if-expr-with-false-true
family: check
params: { check: if-expr-with-false-true }
message: "use `not ...` instead of `False if ... else True`"
description: "A conditional expression with `False` and `True` arms."
example: "x = False if a else True"
severity: off
category: style
---
id: if-expr-with-twisted-arms
family: check
params: { check: if-expr-with-twisted-arms }
message: "use `a if a else b` instead of `b if not a else a`"
description: "A conditional expression `b if not a else a`."
example: "x = b if not a else a"
severity: off
category: style
---
id: unnecessary-placeholder
family: check
params: { check: unnecessary-placeholder }
message: "unnecessary `{name}`: the body has other statements"
description: "A `pass` or `...` statement in a body of two statements or more."
example: "def f():\n    pass\n    x = 1"
severity: off
category: style
---
id: multiple-starts-ends-with
family: check
params: { check: multiple-starts-ends-with }
message: "call `{name}` once with a tuple"
description: "`a.startswith(x) or a.startswith(y)` (also `endswith`): the methods take a tuple."
example: "x = a.startswith(\"a\") or a.startswith(\"b\")"
severity: off
category: style
---
id: unnecessary-collection-call
family: check
params: { check: unnecessary-collection-call }
message: "unnecessary `{name}()` call: write a literal"
description: "`dict()`, `list()` or `tuple()` with no arguments (`dict` with keyword arguments only)."
example: "x = list()"
severity: off
category: style
---
id: unused-unpacked-variable
family: scope
params: { check: unused-variable, mode: unpacked }
message: "unpacked variable `{name}` is never used"
description: "A name of a tuple target in a function that the function never reads (not `_` names, not in functions that call `locals()`)."
example: "def f():\n    a, b = g()\n    return a"
severity: off
category: suspicious
---
id: mutable-class-default
family: check
params: { check: mutable-class-default }
message: "mutable default value for class attribute: annotate it with `ClassVar` or use an immutable value"
description: "A class attribute assigned a list, dict, set or comprehension (or a call that builds one) without a `ClassVar` or `Final` annotation; data classes, Pydantic models and named tuples are left alone."
example: "class A:\n    x = []"
severity: off
category: suspicious
---
id: useless-import-alias
family: check
params: { check: useless-import-alias }
message: "import alias `{name}` does not rename the original"
description: "`import a as a` or `from m import a as a`."
example: "import os as os"
severity: off
category: style
---
id: blind-except
family: check
params: { check: blind-except }
message: "do not catch blind exception `{name}`"
description: "`except Exception` or `except BaseException` whose body neither raises again nor logs the traceback."
example: "try:\n    pass\nexcept Exception:\n    pass"
severity: off
category: suspicious
---
id: collapsible-if
family: check
params: { check: collapsible-if }
message: "use a single `if` with `and` instead of nested `if` statements"
description: "An `if` whose only statement is another `if`, neither having `elif` or `else`."
example: "if a:\n    if b:\n        pass"
severity: off
category: style
---
id: try-except-pass
family: check
params: { check: try-except-pass }
message: "`try`-`except`-`pass`: consider logging the exception"
description: "A handler for everything (`except:`, `except Exception`) whose only statement is `pass`."
example: "try:\n    pass\nexcept Exception:\n    pass"
severity: off
category: suspicious
---
id: leftover-debugger
family: check
params: { check: leftover-debugger }
message: "remove the debugger: import or call left in the code"
description: "An import of `pdb`, `ipdb`, `pudb`, `wdb`, `rpdb` or `bpdb`, or a call of `breakpoint()` or `pdb.set_trace()`."
example: "import pdb"
severity: warn
category: suspicious
---
id: needless-bool
family: check
params: { check: needless-bool }
message: "return the condition directly instead of returning a boolean in each branch"
description: "An `if` that returns `True` (or `False`) and is followed, or continued by `else`, by the opposite boolean."
example: "def f(x):\n    if x:\n        return True\n    return False"
severity: off
category: style
---
id: if-with-same-arms
family: check
params: { check: if-with-same-arms }
message: "combine the `if` branches with `or`: their bodies are the same"
description: "Two neighbouring branches of an `if`/`elif` chain with the same body."
example: "if a:\n    x = 1\nelif b:\n    x = 1"
severity: off
category: style
---
id: open-file-without-with
family: check
params: { check: open-file-without-with }
message: "use a context manager for opening files"
description: "A call of `open` (or of `tempfile.NamedTemporaryFile` and the like) that is not the context of a `with`, not returned and not given to `enter_context`."
example: "f = open(\"a\")"
severity: off
category: suspicious
---
id: nested-with
family: check
params: { check: nested-with }
message: "use a single `with` statement with several contexts"
description: "A `with` whose only statement is another `with` (both sync or both async)."
example: "with a:\n    with b:\n        pass"
severity: off
category: style
---
id: raise-vanilla-class
family: check
params: { check: raise-vanilla-class }
message: "create your own exception instead of raising `Exception`"
description: "A `raise` of the builtin `Exception`."
example: "raise Exception(\"x\")"
severity: off
category: style
---
id: type-check-without-type-error
family: check
params: { check: type-check-without-type-error }
message: "prefer `TypeError` for an invalid type"
description: "A branch tested with `isinstance`, `issubclass` or `callable` that raises a builtin exception other than `TypeError` (and `NotImplementedError`)."
example: "if not isinstance(x, int):\n    raise ValueError(\"x\")"
severity: off
category: style
---
id: explicit-return-none
family: check
params: { check: explicit-return-none }
message: "do not explicitly `return None` in a function that returns nothing else"
description: "A `return None` in a function whose other returns (if any) return nothing or `None`, and that is not a generator. Left alone: a function that is only `return None`, a property, a function annotated with anything but `None`."
example: "def f(x):\n    if x:\n        return None\n    print(x)"
severity: off
category: style
---
id: useless-expression
family: check
params: { check: useless-expression }
message: "useless expression: assign it to a variable or remove it"
description: "An expression statement that is only a name, an attribute, a number, a constant or a collection display."
example: "x = 1\nx"
severity: warn
category: suspicious
---
id: implicit-concat-in-collection
family: check
params: { check: implicit-concat-in-collection }
message: "parenthesize the implicit string concatenation in a collection, or add the missing comma"
description: "An element of a list, tuple or set that is several string literals one after the other, without parentheses."
example: "x = [\"a\" \"b\", \"c\"]"
severity: off
category: suspicious
---
id: unsorted-dunder-all
family: check
params: { check: unsorted-dunder-all }
message: "`{name}` is not sorted"
description: "An `__all__` list or tuple of strings out of order: constants (upper case) first, then classes (capitalized), then the rest, each in natural order."
example: "__all__ = [\"b\", \"a\"]"
severity: off
category: style
---
id: unsorted-dunder-slots
family: check
params: { check: unsorted-dunder-slots }
message: "`{name}` is not sorted"
description: "A `__slots__` list or tuple of strings out of natural order."
example: "class A:\n    __slots__ = (\"b\", \"a\")"
severity: off
category: style
---
id: union-annotation
family: check
params: { check: union-annotation }
message: "use `X | Y` instead of `Union`"
description: "A `typing.Union[...]` subscript, for a target version that has `X | Y` (3.10)."
example: "from typing import Union\nx: Union[int, str]"
severity: off
category: style
---
id: optional-annotation
family: check
params: { check: optional-annotation }
message: "use `X | None` instead of `Optional`"
description: "A `typing.Optional[...]` subscript, for a target version that has `X | Y` (3.10)."
example: "from typing import Optional\nx: Optional[int]"
severity: off
category: style
---
id: deprecated-typing-alias
family: check
params: { check: deprecated-typing-alias }
message: "use the builtin `{name}` instead of its alias in `typing`"
description: "A subscript of `typing.List`, `Dict`, `Set`, `FrozenSet`, `Tuple` or `Type`, for a target version where the builtin is generic (3.9)."
example: "from typing import List\nx: List[int]"
severity: off
category: style
---
id: default-type-arguments
family: check
params: { check: default-type-arguments }
message: "unnecessary default type arguments"
description: "`Generator[X, None, None]` or `AsyncGenerator[X, None]`, for a target version where the arguments have defaults (3.13)."
example: "from typing import Generator\nx: Generator[int, None, None]"
severity: off
category: style
---
id: quoted-annotation
family: check
params: { check: quoted-annotation }
message: "remove the quotes from the annotation"
description: "A quoted name in a parameter, return or variable annotation, for a target version that does not evaluate annotations (3.14)."
example: "def f(x: \"int\"):\n    pass"
severity: off
category: style
---
id: type-alias-annotation
family: check
params: { check: type-alias-annotation }
message: "type alias `{name}` uses `TypeAlias` instead of the `type` keyword"
description: "`X: TypeAlias = ...`, for a target version with the `type` statement (3.12)."
example: "from typing import TypeAlias\nX: TypeAlias = int"
severity: off
category: style
---
id: generic-class
family: check
params: { check: generic-class }
message: "generic class `{name}` uses a `Generic` base instead of type parameters"
description: "A class with `Generic[...]` among its bases, for a target version with type parameters (3.12)."
example: "from typing import Generic, TypeVar\nT = TypeVar(\"T\")\nclass A(Generic[T]):\n    pass"
severity: off
category: style
---
id: generic-function
family: check
params: { check: generic-function }
message: "generic function `{name}` should use type parameters"
description: "A function outside a class whose signature uses a module-level `TypeVar`, `ParamSpec` or `TypeVarTuple`, for a target version with type parameters (3.12)."
example: "from typing import TypeVar\nT = TypeVar(\"T\")\ndef f(x: T) -> T:\n    return x"
severity: off
category: style
---
id: datetime-utc-alias
family: check
params: { check: datetime-utc-alias }
message: "use `datetime.UTC` instead of `datetime.timezone.utc`"
description: "`datetime.timezone.utc` (also imported as `timezone.utc`), for a target version that has `datetime.UTC` (3.11)."
example: "import datetime\nx = datetime.timezone.utc"
severity: off
category: style
---
id: deprecated-import
family: check
params: { check: deprecated-import }
message: "{name}"
description: "An import from `typing_extensions` of a name that `typing`, `collections.abc` or `warnings` has in the target version, from `typing` of an alias of a `collections.abc` class, or of `List`, `Dict`, `Set`, `FrozenSet`, `Tuple`, `Type`."
example: "from typing_extensions import Self"
severity: off
category: style
---
id: outdated-version-block
family: check
params: { check: outdated-version-block }
message: "version block is outdated for the target Python version"
description: "A test of `sys.version_info` against a version older than the target's, or of `sys.version_info[0]` against a number: the result is always the same."
example: "import sys\nif sys.version_info >= (3, 8):\n    pass"
severity: off
category: suspicious
---
id: unsorted-imports
family: check
params: { check: unsorted-imports }
message: "the import block is not sorted or not formatted as isort writes it"
description: "A block of imports that differs from the isort layout (ruff's defaults): sections of future, standard library, third-party, first-party and relative imports, `import x` before `from x import y`, names in natural order without regard to case, members as constants, classes, then variables, one statement for each module, lines over 88 columns in parentheses, one blank line between sections and after the block (two before a definition at module level). A folder or file next to the file, in the project root or in its `src` folder, is first-party."
example: "import sys\nimport os"
severity: off
category: style
---
id: cached-method
family: check
params: { check: cached-method }
message: "use of `functools.lru_cache` or `functools.cache` on a method can lead to memory leaks"
description: "A method decorated with `functools.lru_cache` or `functools.cache` (not a static method): the cache keeps `self` alive."
example: "import functools\nclass A:\n    @functools.cache\n    def f(self):\n        pass"
severity: warn
category: suspicious
---
id: function-call-in-default
family: check
params: { check: function-call-in-default }
message: "do not call `{name}` in an argument default: it runs once, when the function is defined"
description: "A call in the default of a parameter (not in a lambda, not a call of an immutable builtin such as `tuple`)."
example: "def f(x=list()):\n    pass"
severity: warn
category: suspicious
---
id: custom-type-var-return
family: check
params: { check: custom-type-var-return }
message: "use `Self` instead of the custom type variable `{name}`"
description: "A method whose `self` is annotated with a type variable that the return annotation repeats."
example: "from typing import TypeVar\nT = TypeVar(\"T\")\nclass A:\n    def f(self: T) -> T:\n        return self"
severity: off
category: style
---
id: any-eq-parameter
family: check
params: { check: any-eq-parameter }
message: "prefer `object` to `Any` for the second parameter to `{name}`"
description: "`other: Any` in `__eq__` or `__ne__`."
example: "from typing import Any\nclass A:\n    def __eq__(self, other: Any) -> bool:\n        return True"
severity: off
category: style
---
id: subprocess-run-without-check
family: check
params: { check: subprocess-run-without-check }
message: "`subprocess.run` without an explicit `check` argument"
description: "A call of `subprocess.run` with no `check` keyword (and no `**kwargs`)."
example: "import subprocess\nsubprocess.run([\"ls\"])"
severity: off
category: suspicious
---
id: type-var-name-variance
family: check
params: { check: type-var-name-variance }
message: "the `TypeVar` name \"{name}\" does not say whether it is covariant or contravariant: end it with `_co` or `_contra`"
description: "A `TypeVar` with `covariant=True` whose name does not end with `_co`, or with `contravariant=True` and a name that does not end with `_contra`."
example: "from typing import TypeVar\nT = TypeVar(\"T\", covariant=True)"
severity: off
category: style
---
id: static-join
family: check
params: { check: static-join }
message: "consider an f-string instead of joining a fixed list of items"
description: "`\"sep\".join([a, b])` of a list or tuple written out in the call, which an f-string says directly."
example: "a = b = \"x\"\nx = \", \".join([a, b])"
severity: off
category: style
---
id: verbose-raise
family: check
params: { check: verbose-raise }
message: "use `raise` without the exception name"
description: "`raise e` in the `except ... as e` clause, where a bare `raise` keeps the traceback."
example: "try:\n    pass\nexcept ValueError as e:\n    raise e"
severity: off
category: style
---
id: bare-raise-outside-handler
family: check
params: { check: bare-raise-outside-handler }
message: "bare `raise` is not inside an exception handler"
description: "A `raise` with no exception in code that no `except` clause of its function contains."
example: "def f():\n    raise"
severity: warn
category: correctness
---
id: no-control-regex
family: regex
params: { check: control }
message: "Unexpected control character(s) in regular expression: {name}."
description: A control character (below U+0020) in the constant string given to `re.compile` and the other functions of `re` that take a pattern, written raw or as `\x00`.
example: "import re\nre.compile('\\x1f')   # reported"
severity: off
category: suspicious
---
id: no-regex-spaces
family: regex
params: { check: spaces }
message: "Spaces are hard to count. Use {{name}}."
description: Two or more spaces outside a character class in the string given to `re.compile` and the other functions of `re` that take a pattern.
example: "import re\nre.compile('a  b')   # reported"
severity: off
category: suspicious
---
id: no-misleading-character-class
family: regex
params: { check: misleading-class }
message: "Unexpected combined character in character class."
description: A character class in the constant string given to `re.compile` and the other functions of `re` that take a pattern, in which a combining mark follows another character.
example: "import re\nre.compile('[a\\u0301]')   # reported"
severity: off
category: suspicious
