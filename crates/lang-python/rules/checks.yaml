id: no-control-regex
family: regex
params: { check: control }
message: "Unexpected control character(s) in regular expression: {name}."
description: >-
  Reports a control character (below U+0020) in the constant string given to `re.compile` and the
  other functions of `re` that take a pattern, written raw or as `\x00`.
example: "import re\nre.compile('\\x1f')   # reported"
severity: off
category: suspicious
