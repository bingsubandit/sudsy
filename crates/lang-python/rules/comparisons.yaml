id: none-comparison
message: compare to None with `is` or `is not`, not `==` or `!=`
description: A comparison of a value to `None` with `==` or `!=`.
example: 'x == None'
severity: warn
category: suspicious
rule:
  any:
    - { pattern: '$A == None' }
    - { pattern: '$A != None' }
    - { pattern: 'None == $A' }
    - { pattern: 'None != $A' }
---
id: not-in-test
message: use `not in`, not `not ... in`
description: A membership test negated in front of the expression (`not a in b`).
example: 'not a in b'
severity: off
category: style
rule:
  any:
    - { pattern: 'not $A in $B' }
    - { pattern: 'not ($A in $B)' }
---
id: not-is-test
message: use `is not`, not `not ... is`
description: An identity test negated in front of the expression (`not a is b`).
example: 'not a is b'
severity: off
category: style
rule:
  any:
    - { pattern: 'not $A is $B' }
    - { pattern: 'not ($A is $B)' }
