id: none-comparison
family: bug
params: { check: compare-literal, values: None, operators: "== !=" }
message: compare to None with `is` or `is not`, not `==` or `!=`
description: A comparison of a value to `None` with `==` or `!=`.
example: 'x == None'
severity: warn
category: suspicious
---
id: true-false-comparison
family: bug
params: { check: compare-literal, values: True False, operators: "== !=" }
message: test the truth of the value instead of comparing it to True or False
description: A comparison of a value to `True` or `False` with `==` or `!=`.
example: 'x == True'
severity: off
category: style
---
id: not-in-test
message: use `not in`, not `not ... in`
description: A membership test negated in front of the expression (`not a in b`).
example: 'not a in b'
severity: off
category: style
rule:
  any:
    - { pattern: 'not $A in $B' }
    - { pattern: 'not ($A in $B)' }
---
id: not-is-test
message: use `is not`, not `not ... is`
description: An identity test negated in front of the expression (`not a is b`).
example: 'not a is b'
severity: off
category: style
rule:
  any:
    - { pattern: 'not $A is $B' }
    - { pattern: 'not ($A is $B)' }
---
id: comparison-with-itself
family: bug
params: { check: self-compare }
message: the value is compared with itself
description: A comparison whose two sides are the same code (Ruff PLR0124).
example: 'x == x'
severity: off
category: suspicious
