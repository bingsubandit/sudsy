vscode-languages: [python]
extensions: [py, pyi, pyw]
formatter: PythonFormatter
parse: adapter::parse_file
families: rules::FAMILIES
hooks: hooks::PythonHooks
options:
  - paren_line_end_parents: [["ExprAwait", "StmtDelete", "StmtAssert"]]
  - line_width: 88
  - indent_size: 4
  - indent_style
  - final_newline: true
  - end_of_line
  - member_chain_style: ["soft"]
  - member_chain_min_groups: [2]
  - member_chain_keep_accesses: ["always"]
  - member_chain_indent: [0]
  - quote_style:
      values: ["double", "single", "preserve"]
      default: "double"
      doc: "Quotes of strings (and of f-string and t-string literals): `double` or `single` rewrite a string to that quote unless the other one needs fewer escapes, `preserve` keeps what the source has."
  - magic_trailing_comma:
      values: ["respect", "ignore"]
      default: "respect"
      doc: "`respect` keeps a collection, call or parameter list that has a trailing comma expanded one item per line; `ignore` joins it when it fits and removes the comma."
  - keep_final_semicolon:
      default: false
      doc: "Keep the `;` after the last statement of the file (a notebook cell: the semicolon hides the cell's output, so it is code)."
  - keep_statement_parentheses:
      default: false
      doc: "Keep one pair of parentheses around an expression statement written with them (a notebook cell shows the value of its last expression)."
  - module_docstring:
      default: true
      doc: "Format the first string of a module as its docstring (quotes, indentation, the blank line after it). A notebook cell has none."
  - dialect:
      values: ["auto", "python", "ipython"]
      default: "auto"
      doc: "`ipython` also reads IPython syntax: lines of `%magic`, `!shell` and `?help` stay as written. `auto` is Python."
  - target_version:
      values: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
      default: "3.14"
      doc: "The Python version whose syntax the file must follow: newer syntax is a syntax error (`lazy import` needs 3.15)."
presets: [ruff]
