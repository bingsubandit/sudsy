vscode-languages: [dockerfile]
grammar-crate: tree-sitter-containerfile
grammar-path: grammars/tree-sitter-containerfile
extensions: [dockerfile]
file-names: [Dockerfile, Containerfile, "Dockerfile.*", "Containerfile.*"]
formatter: DockerfileFormatter
families: rules::FAMILIES
dev-deps: [insta, lang-shell]
options:
  - indent_size: 4
  - indent_style
  - final_newline: true
  - end_of_line
  - max_blank_lines: [1, "Largest number of blank lines kept between instructions and comments."]
  - binary_operator_line: ["start"]
  - space_redirects:
      default: true
      doc: "A blank after the operator of a redirect that opens a file in the shell code of `RUN` (`> file`)."
  - indent_case_arms:
      default: true
      doc: "The arms of a `case` in the shell code of `RUN` one level inside it."
  - keep_final_newline:
      default: false
      doc: "A file that does not end with a line break stays without one (the final newline is not added)."
  - comment_space:
      default: false
      doc: "A line comment whose `#` run is followed by a letter or digit gets a blank after it (`#x` as `# x`); a parser directive before the first instruction stays."
  - key_value_pairs:
      default: false
      doc: "`ENV` and `LABEL` in the legacy form `key value` as `key=value` (a value with blanks in double quotes), where both read as the same value: the value has no quote and no backslash, or is one word (a backslash stays as written), or is one quoted string."
  - json_copy_as_words:
      default: false
      doc: "The JSON array of `COPY` and `ADD` as plain arguments (`COPY [\"a\", \"b\"]` as `COPY a b`) where every element is a plain path word (letters, digits and `_./:@%+,=~*?^-`, not starting with `-`) and the array is on one line."
presets: [hadolint, dockerfmt]
mapping:
  wrap: {Raw: Instruction}
  same: 'comment line_continuation shell_command json_string'
  Document: source_file
  Instruction: from_instruction run_instruction cmd_instruction label_instruction expose_instruction env_instruction add_instruction copy_instruction entrypoint_instruction volume_instruction user_instruction workdir_instruction arg_instruction onbuild_instruction healthcheck_instruction shell_instruction
  Keyword: FROM AS RUN CMD LABEL EXPOSE ENV ADD COPY ENTRYPOINT VOLUME USER WORKDIR ARG ONBUILD HEALTHCHECK SHELL
  StageName: image_alias
  Heredoc: heredoc_block
  Raw: stopsignal_instruction maintainer_instruction cross_build_instruction
  Word: param mount_param end_of_options env_pair label_pair arg_pair expose_port image_spec path expansion unquoted_string double_quoted_string single_quoted_string NONE
