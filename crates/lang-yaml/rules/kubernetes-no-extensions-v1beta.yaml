id: kubernetes-no-extensions-v1beta
message: "the API version `v1beta1` of this group is removed: use a current version (`apps/v1`, `networking.k8s.io/v1`, `apiextensions.k8s.io/v1`)"
description: >-
  Reports a Kubernetes manifest with `apiVersion: extensions/v1beta1` or
  `apiextensions.k8s.io/v1beta1`. The report is on the `kind:` line of the manifest.
why: >-
  A current Kubernetes version no longer serves these API versions, so it rejects the manifest.

  To fix, use `apps/v1`, `networking.k8s.io/v1` or `apiextensions.k8s.io/v1`.
example: "apiVersion: extensions/v1beta1   # kind: Ingress"
severity: off
category: correctness
rule:
  kind: BlockMapping
  top-level:
    apiVersion: '^(?:extensions|apiextensions\.k8s\.io)/v1beta1$'
    kind: '^(?<KIND>\w+)$'
report-on: $KIND
