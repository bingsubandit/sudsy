id: kubernetes-drop-net-raw-capability
message: "a container of the pod sets `capabilities` but does not drop `NET_RAW` or `ALL`"
description: >-
  Reports a Kubernetes manifest (kinds as in `kubernetes-no-read-only-root-fs`) with a container or
  init container whose `securityContext.capabilities` exists and whose `drop` list has neither
  `NET_RAW` nor `ALL`. The report is on the `kind:` line of the manifest.
why: >-
  `NET_RAW` lets a process craft packets and spoof addresses, which helps an attacker inside the
  cluster network.

  To fix, add `NET_RAW` (or `ALL`) to `capabilities.drop`.
example: "kind: Pod   # capabilities: {add: [NET_ADMIN]}"
severity: off
category: suspicious
rule:
  kind: BlockMapping
  top-level:
    apiVersion: '^(?:[a-z0-9][a-z0-9.-]*/)?v\d+(?:alpha|beta)?\d*$'
    kind: '^(?<KIND>Pod|Deployment|DaemonSet|StatefulSet|ReplicaSet|ReplicationController|Job|CronJob)$'
  has:
    role: key-value
    key-path: '^spec(\.template\.spec|\.jobTemplate\.spec\.template\.spec)?\.(containers|initContainers)\[\d+\]\.securityContext$'
    fields: { key: { regex: '^capabilities$' } }
    not:
      has:
        key-path: '^spec(\.template\.spec|\.jobTemplate\.spec\.template\.spec)?\.(containers|initContainers)\[\d+\]\.securityContext\.capabilities\.drop\[\d+\]$'
        regex: '^["'']?(NET_RAW|(?i:all))["'']?$'
report-on: $KIND
