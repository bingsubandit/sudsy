id: no-plain-text-secure-string
message: do not convert a plain text string with ConvertTo-SecureString -AsPlainText; read the secret as a SecureString
description: >-
  Reports a call of `ConvertTo-SecureString` with `-AsPlainText`.
why: >-
  It turns a clear-text string into a `SecureString`, and the clear text is in the script, the
  history and the logs already. The protection is only in name.

  To fix, read the secret as a `SecureString` (`Read-Host -AsSecureString`, a vault or
  `Get-Credential`).
example: 'ConvertTo-SecureString $p -AsPlainText -Force'
severity: error
category: suspicious
rule: { kind: Command, regex: '(?is)^convertto-securestring\s(.*\s)?-asplaintext\b' }
report-on: first-token
---
id: no-wmi-cmdlets
message: the WMI cmdlets are removed from PowerShell 7; use the CIM cmdlets (Get-CimInstance, Invoke-CimMethod, ...)
description: >-
  Reports a call of `Get-WmiObject`, `Invoke-WmiMethod`, `Register-WmiEvent`, `Remove-WmiObject` or
  `Set-WmiInstance`.
why: >-
  The WMI cmdlets are not in PowerShell 7 and later. The CIM cmdlets (`Get-CimInstance`,
  `Invoke-CimMethod`) do the same work on Windows, use the newer remoting protocol, and are in both
  editions.

  To fix, use the CIM cmdlet of the same job.
example: 'Get-WmiObject Win32_Process'
severity: warn
category: suspicious
rule: { kind: Command, regex: '(?i)^(get-wmiobject|invoke-wmimethod|register-wmievent|remove-wmiobject|set-wmiinstance)(\s|$)' }
report-on: first-token
