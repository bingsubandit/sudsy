id: supports-should-process
message: "Function '$0' has verb that could change system state. Therefore, the function has to support 'ShouldProcess'."
description: >-
  Reports a function whose name has the verb `New`, `Set`, `Remove`, `Start`, `Stop`, `Restart`,
  `Reset` or `Update` and whose text has no `SupportsShouldProcess`, or has `SupportsShouldProcess =
  $false`.
why: >-
  A command that changes something is expected to accept `-WhatIf` and `-Confirm`, so a user can see
  what it would do first. Without `SupportsShouldProcess`, they are not available and the user must
  run it to find out.

  To fix, add `[CmdletBinding(SupportsShouldProcess)]` and call `$PSCmdlet.ShouldProcess(...)`
  before the change.
example: 'function Remove-Thing { }'
severity: off
category: suspicious
rule:
  kind: Function
  any:
    - not: { regex: '(?i)SupportsShouldProcess' }
    - regex: '(?i)SupportsShouldProcess\s*=\s*\$false'
token: { kind: [Word], regex: '(?i)^(New|Set|Remove|Start|Stop|Restart|Reset|Update)-' }
---
id: singular-nouns
message: "The cmdlet '$0' uses a plural noun. A singular noun should be used instead."
description: >-
  Reports a function named `Verb-Nouns` whose noun ends in `s`. A noun that ends in `ss`, `us`, `is`
  or `as` (`Status`, `Address`, `Analysis`, `Alias`) is not reported.
why: >-
  The Microsoft guidelines name the noun in the singular, even when the command returns many
  objects, so that users can guess names and the names look the same in every module.

  To fix, use the singular noun.
example: 'function Get-Items { }'
severity: off
category: style
rule: { kind: Function }
token:
  kind: [Word]
  regex: '^([A-Za-z]+:)?[A-Za-z]+-[A-Za-z0-9-]*[A-Za-z0-9]s$'
  not-regex: '(?i)(ss|us|is|as|news|series|species|data)$'
---
id: process-block-for-pipeline
message: Command accepts pipeline input but has not defined a process block.
description: >-
  Reports a function or script block with a parameter that has `ValueFromPipeline` or
  `ValueFromPipelineByPropertyName` and no `process` block. A `filter` counts as having one.
why: >-
  Without a `process` block the body runs once, after the pipeline has finished, and sees only the
  last object that came in. The others are lost.

  To fix, put the work in `process { }`.
example: 'function Get-Name { param([Parameter(ValueFromPipeline)]$Item) $Item.Name }'
severity: off
category: correctness
rule:
  kind: ParamDecl
  regex: '(?is)^\[\s*Parameter\s*\([^]]*ValueFromPipeline'
  parent: { kind: ScriptBlock, not: { regex: '(?i)\bprocess\s*\{' } }
  not-inside: { kind: Function, regex: '(?i)^filter\b' }
token: { kind: [Word], regex: '^\$[A-Za-z_]' }
