id: no-plain-text-password
message: a password parameter should be a SecureString or a PSCredential, not a string
description: >-
  Reports a `[string]` parameter whose name contains `password`, `passphrase` or `cred`.
why: >-
  A `[string]` stays in memory as clear text and is easy to log or to show in history and
  transcripts. `[SecureString]` and `[PSCredential]` keep the secret protected and make the cmdlet
  fit with the credential handling of other commands.

  To fix, take a `[SecureString]` or a `[PSCredential]`.
example: 'param([string]$Password)'
severity: warn
category: suspicious
rule: { kind: ParamDecl, regex: '(?is)\[string\]\s*\$\w*(password|passphrase|cred)\w*(\s|=|,|$)' }
---
id: no-default-true-switch
message: a switch parameter should not default to $true; the caller cannot turn it off
description: >-
  Reports a `[switch]` parameter with the default value `$true`.
why: >-
  A switch is present or absent, and the caller turns it on by naming it. A switch that is on by
  default can be turned off only with the odd form `-Name:$false`.

  To fix, invert the meaning, with a name for the opposite (`-NoLog` for `-Log`).
example: 'param([switch]$Force = $true)'
severity: warn
category: suspicious
rule: { kind: ParamDecl, regex: '(?is)\[switch\]\s*\$\w+\s*=\s*\$true\b' }
---
id: approved-verbs
message: the verb of the function name is not an approved PowerShell verb (see Get-Verb)
description: >-
  Reports a function named `Verb-Noun` whose verb is not one that `Get-Verb` returns. A name without
  a dash is not checked.
why: >-
  PowerShell users find commands by verb (`Get-Command -Verb Get`) and expect a verb to mean the
  same in every module. An unapproved verb such as `Make-` or `Delete-` also makes `Import-Module`
  print a warning about the module's names.

  To fix, rename the function with an approved verb (`New-`, `Remove-`).
example: 'function Fetch-Data { }'
severity: off
category: style
rule: { kind: Function }
token:
  kind: [Word]
  regex: '^([A-Za-z]+:)?[A-Za-z]+-[A-Za-z]'
  not-regex: '(?i)^([A-Za-z]+:)?(Add|Approve|Assert|Backup|Block|Build|Checkpoint|Clear|Close|Compare|Complete|Compress|Confirm|Connect|Convert|ConvertFrom|ConvertTo|Copy|Debug|Deny|Deploy|Disable|Disconnect|Dismount|Edit|Enable|Enter|Exit|Expand|Export|Find|Format|Get|Grant|Group|Hide|Import|Initialize|Install|Invoke|Join|Limit|Lock|Measure|Merge|Mount|Move|New|Open|Optimize|Out|Ping|Pop|Protect|Publish|Push|Read|Receive|Redo|Register|Remove|Rename|Repair|Request|Reset|Resize|Resolve|Restart|Restore|Resume|Revoke|Save|Search|Select|Send|Set|Show|Skip|Split|Start|Step|Stop|Submit|Suspend|Switch|Sync|Test|Trace|Unblock|Undo|Uninstall|Unlock|Unprotect|Unpublish|Unregister|Update|Use|Wait|Watch|Write)-'
---
id: no-global-vars
message: avoid the global scope; pass the value as a parameter or use the script or module scope
description: >-
  Reports a variable in the `global:` scope, other than the special variables that PowerShell and
  its tools use (`$global:LASTEXITCODE`, `$global:ErrorActionPreference`,
  `$global:PSDefaultParameterValues` and so on).
why: >-
  A global variable is shared by everything in the session, including other modules and the user's
  own commands. Two scripts that use the same name change each other's state, and the value is hard
  to trace to where it was set.

  To fix, pass values as parameters, or use a `script:` variable.
example: '$global:count = 1'
severity: off
category: suspicious
rule:
  any: [{ kind: Program }, { kind: Command }, { kind: AssignStmt }, { kind: Binary }, { kind: Unary }, { kind: HashEntry }, { kind: ParamDecl }, { kind: Block }, { kind: ScriptBlock }, { kind: Function }, { kind: CatchClause }, { kind: Foreach }]
token: { kind: [Word], needs: ':', regex: '(?i)^[$@](\{)?global:', not-regex: '(?i)^[$@]\{?global:(\w+Preference|PSDefaultParameterValues|LASTEXITCODE|Error|Host|HOME|PWD|PSHOME|PSVersionTable|ShellId|ExecutionContext|OFS|OutputEncoding|MaximumHistoryCount|StackTrace|Matches|input|true|false|null)\b' }
---
id: no-automatic-variable-assignment
message: do not use the name of an automatic variable for a variable or parameter
description: >-
  Reports an assignment to an automatic variable, a parameter or a `foreach` variable that has the
  name of one (`$Error`, `$Event`, `$input`, `$PSItem`, `$_`, `$PWD`, `$Host`, `$this`, `$true` and
  so on). `$null = ...` is not reported.
why: >-
  Automatic variables are set by PowerShell, so an assignment is overwritten or is refused, and a
  parameter with the same name hides the value that other code expects (`$input`, `$Host`). The code
  reads as if it set something that it does not.

  To fix, use another name.
example: '$input = 1'
severity: warn
category: correctness
rule:
  any: [{ kind: AssignStmt }, { kind: ParamDecl }, { kind: Foreach }]
  regex: '(?is)^(foreach\s*\(\s*|(\[[^\]]*\]\s*)*)\$(args|ConsoleFileName|Error|Event|EventArgs|EventSubscriber|ExecutionContext|false|foreach|HOME|Host|input|IsCoreCLR|IsLinux|IsMacOS|IsWindows|Matches|MyInvocation|NestedPromptLevel|PID|PROFILE|PSBoundParameters|PSCmdlet|PSCommandPath|PSCulture|PSDebugContext|PSEdition|PSHOME|PSItem|PSScriptRoot|PSSenderInfo|PSUICulture|PSVersionTable|PWD|Sender|ShellId|StackTrace|this|true|_)\b(\s*[-+*/%?]*=([^=]|$)|\s+in\b|\s*$)'
---
id: null-comparison-side
message: put $null on the left of the comparison; with an array on the left `$x -eq $null` filters instead of testing
description: >-
  Reports a `-eq` or `-ne` comparison (or a case variant, as `-ceq`) with `$null` on the right.
why: >-
  When the left side is an array, `-eq` and `-ne` filter it and return the elements: `@(1, 2) -eq
  $null` is an empty array and `@(1, 2) -ne $null` is the whole array. The test does not say whether
  the value itself is `$null`.

  To fix, write `$null` on the left: `$null -eq $x`.
example: 'if ($x -eq $null) { }'
severity: warn
category: correctness
rule:
  kind: Binary
  regex: '(?i)\s-[ci]?(eq|ne)\s+\$null$'
  not: { regex: '(?i)\s-(and|or|xor)\s' }
