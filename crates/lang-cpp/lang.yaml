vscode-languages: [c, cpp]
options:
  - line_width: 80
  - indent_size: 2
  - indent_style
  - final_newline: true
  - end_of_line
  - max_blank_lines: [1, "Largest number of blank lines kept between statements and comments."]
  - comment_keep_unicode_blanks: [true]
  - wrap_lines:
      default: true
      doc: "Break lines that are longer than `line_width`. When false, every line keeps the line breaks of the source (only indentation and spacing change)."
  - continuation_indent:
      range: [0, 16]
      default: 4
      doc: "Columns a wrapped line is indented more than the line it continues, where it is not aligned to a bracket."
  - access_modifier_outdent:
      range: [0, 16]
      default: 2
      doc: "Columns `public:`, `private:` and `protected:` are outdented from the members of their class."
      kinds:
        outdent: [AccessSpecifier]
  - indent_case_labels:
      default: false
      doc: "Indent `case` labels one level inside their `switch`."
      kinds:
        outdent_unless: [CaseClause]
  - indent_goto_labels:
      default: true
      doc: "A goto label stands one indent left of the statements of its block; when false it starts at column 0."
      kinds:
        flush_unless: [LabelStatement]
  - keep_leading_blank_lines:
      default: true
      doc: "Blank lines at the start of the file stay."
  - indent_pp_directives:
      values: ["none", "keep"]
      default: "none"
      doc: "A preprocessor directive starts with `#` directly followed by its keyword (`none`) or keeps the blanks written after the `#` (`keep`)."
      kinds:
        tight: [Directive]
  - namespace_indentation:
      values: ["none", "inner", "all"]
      default: "none"
      doc: "Indent the contents of namespaces: `none`, only namespaces nested in another (`inner`), or `all`."
      kinds:
        flat: [NamespaceDeclaration]
  - pointer_alignment:
      values: ["right", "left", "middle"]
      default: "right"
      doc: "Where the `*` and `&` of a pointer or reference declarator go: next to the name (`right`), next to the type (`left`) or between them (`middle`)."
      kinds:
        tight_after: [Ellipsis]
        tight_behind: [Star, Amp, AmpAmp]
        pointer: [Star, Amp, AmpAmp]
        pointer_in: [Parameter, FunctionDeclaration, SimpleDeclaration, TemplateArguments, Line, Directive, DeclaratorGroup, Condition]
        pointer_in_under: [Cast]
        pointer_in_loose: [ForStatement, CatchClause, Parameter]
        pointer_ref: [Amp, AmpAmp]
        pointer_type: [Ident, Keyword, Greater, GreaterGreater]
        pointer_name: [Ident, Keyword, Lsqb]
        pointer_not_name: [Captures]
        pointer_bare: [TemplateArguments]
        pointer_end: [Greater, GreaterGreater, Comma, Rpar, Ellipsis, Lsqb]
        pointer_shaped: [ParenGroup]
        binary_node: [Binary]
        binary_clear: [Assignment, ReturnStatement, Binary, Ternary, Index, Unary, Arguments, Parenthesized, Condition]
        binary_cast: [Rpar]
        binary_spaced: [Amp]
        binary_operand: [MemberAccess]
  - pointer_qualifier_words:
      kind: "words"
      default: [noexcept, override, final, requires]
      doc: "Words that are no name when they follow a `*`, `&` or `&&` of a declarator (`T &noexcept`): a blank stands before them."
  - derive_pointer_alignment:
      default: false
      doc: "Take `pointer_alignment` from the file: the side that most of its declarators of pointers and references use (a `*` or `&` with a blank before and none after against none before and a blank after); `pointer_alignment` stays where both sides are equal."
  - space_after_cast:
      default: false
      doc: "A blank after the `)` of a C cast (`(int) x` against `(int)x`)."
      kinds:
        cast_node: [Cast]
        cast_group: [ParenGroup, Parenthesized]
        cast_close: [Rpar]
        cast_keep: [AmpAmp, Plus]
        cast_tight: [Star, Amp, Minus]
  - empty_line_before_access_modifier:
      values: ["never", "leave", "logical_block", "always"]
      default: "logical_block"
      doc: "A blank line before `public:`, `private:` and `protected:` (not the first item of a class): removed (`never`), as written (`leave`), added unless a comment stands in front (`logical_block`) or always added."
      kinds:
        blank_before: [AccessSpecifier]
  - keep_blank_lines_at_end_of_blocks:
      default: false
      doc: "A blank line before the closing brace of a block stays."
      kinds:
        keep_end: [Block]
        keep_end_under: [NamespaceDeclaration, EnumSpecifier]
        keep_end_before: [Keyword, CatchClause]
  - join_closing_angles:
      default: false
      doc: "Two closing template brackets are written together (`A<B<C>>` against `A<B<C> >`), as C++11 reads them. Only a `>` that closes a template bracket is joined, a comparison or a shift stays apart."
      kinds:
        close_join: [Greater]
        close_join_in: [TemplateArguments, TemplateParameters]
  - empty_body_own_line:
      default: false
      doc: "The `;` that is the whole body of an `if`, `for` or `while` goes on its own line below the head, indented (`while (x)\\n  ;`)."
      kinds:
        own_empty: [IfStatement, ForStatement, WhileStatement]
  - collapse_empty_blocks:
      default: false
      doc: "An empty body is `{}` when its line fits, except the block of `if`, `for`, `while`, `do`, `try` and `catch` and a block inside a block, which has two lines (`if (x) {\\n}`)."
      kinds:
        split_in: [IfStatement, ForStatement, WhileStatement, DoStatement, TryStatement, CatchClause, Block]
  - braced_list_padding:
      default: false
      doc: "A blank inside the braces of an initializer list (`{ 1, 2 }` against `{1, 2}`); an empty list is `{}`."
      kinds:
        pad_list: [InitList]
        pad_open: [Lbrace]
        pad_close: [Rbrace]
        pad_except: [Semi]
  - brace_wrapping:
      kind: "words"
      doc: "Constructs whose opening brace goes on its own line: `class`, `struct`, `union`, `enum`, `function`, `namespace`, `extern`, `control` (if, for, while, switch, do, try), `case`, `else` (the `else` after a block starts a line), `catch` (the `catch` after a block starts a line), `while` (the `while` of a do loop starts a line). Empty: every brace stays on the line of its construct."
      kinds:
        attach:
          function: [FunctionDeclaration]
          control: [IfStatement, ForStatement, WhileStatement, SwitchStatement, DoStatement, TryStatement]
          class: [ClassSpecifier]
          struct: [ClassSpecifier]
          union: [ClassSpecifier]
          enum: [EnumSpecifier]
          namespace: [NamespaceDeclaration]
        attach_call:
          function: [Call]
        attach_after: [Rpar, Rsqb, Ident, Keyword, Greater]
        attach_in: [Block]
        attach_apart: [Directive]
  - split_empty_braces:
      kind: "words"
      default: []
      doc: "Words of `brace_wrapping` whose empty body keeps `{` and `}` on two lines when the `{` is on its own line (`void f()\\n{\\n}`), as `SplitEmptyFunction`, `SplitEmptyRecord` and `SplitEmptyNamespace`. Other empty bodies are `{}`."
  - for_each_macros:
      kind: "words"
      default: [foreach, Q_FOREACH, BOOST_FOREACH]
      doc: "Names of macros that are used as loops: `name(args) {` is a `control` brace. Any other `name(args) {` is a function definition for `brace_wrapping`."
      kinds:
        loop_call:
          control: [Call]
  - align_with_tabs:
      default: false
      doc: "With `indent_style: tab`, the alignment of continuation lines uses tabs for each whole indent width and spaces for the rest."
  - indent_braces:
      default: false
      doc: "Indent a brace that is on its own line together with the block it opens."
  - short_functions:
      values: ["none", "empty", "inline", "all"]
      default: "all"
      doc: "Function bodies kept on the line of the signature when they fit: `none`, `empty` (`{}` only), `inline` (functions defined in a class, and empty ones) or `all`."
      kinds:
        fit: [FunctionDeclaration, Line]
  - short_ifs:
      values: ["never", "without_else", "all"]
      default: "never"
      doc: "An `if` with a simple statement is kept on one line when it fits: `never`, without an `else`, or with or without."
      kinds:
        join: [IfStatement]
        head: [Condition]
  - short_loops:
      default: false
      doc: "A `for`, `while` or range-for with a simple statement is kept on one line when it fits."
      kinds:
        join: [ForStatement, WhileStatement]
        head: [Condition]
  - short_lambdas:
      values: ["none", "empty", "inline", "all"]
      default: "all"
      doc: "Lambda bodies kept on the line of the lambda when they fit: `none`, `empty`, `inline` (a lambda that is an argument) or `all`."
      kinds:
        fit: [Lambda]
  - short_case_labels:
      default: false
      doc: "A `case` label and its simple statement are kept on one line when they fit."
  - bin_pack_arguments:
      default: true
      doc: "Call arguments that do not fit on a line are filled; when false they go one per line (or all on one line)."
  - bin_pack_parameters:
      default: true
      doc: "Function parameters that do not fit on a line are filled; when false they go one per line (or all on one line)."
  - align_after_open_bracket:
      values: ["align", "dont_align", "always_break"]
      default: "align"
      doc: "Wrapped lines inside brackets line up with the first token after the bracket (`align`), continue with `continuation_indent` (`dont_align`), or always start on a new line after the bracket (`always_break`). Only a list with a comment at a line break is laid out by this option today: its first item goes on the line of the bracket when that line fits; any other list keeps the indentation of the source."
      kinds:
        hug_brace_after: [Ident, Greater]
        hug_brace_hang: [Equal]
        hug_comment_down: [InitList]
        comment_continue: [FunctionDeclaration, SimpleDeclaration]
        name_break: [FunctionDeclaration]
        name_break_after: [Keyword, Star, Greater]
        hug_unless: [Lambda, Block, InitList]
  - column_list_min_commas:
      range: [0, 100]
      default: 5
      doc: "A braced list with at least this many commas is laid out in columns, every cell padded to the widest of its column; 0 turns the layout off."
  - break_before_binary_operators:
      values: ["none", "non_assignment", "all"]
      default: "none"
      doc: "A wrapped binary expression breaks after the operator (`none`), before it except for assignments (`non_assignment`) or before every operator (`all`)."
  - break_constructor_initializers:
      values: ["before_colon", "before_comma"]
      default: "before_colon"
      doc: "Constructor initializer lists that do not fit start on a new line before the colon (`before_colon`, one initializer per line when needed), or put a comma before each initializer, one per line (`before_comma`)."
  - constructor_initializer_indent:
      range: [0, 16]
      default: 4
      doc: "Columns a constructor initializer list is indented more than its constructor."
  - break_after_return_type:
      values: ["none", "top_level", "all", "top_level_definitions", "all_definitions"]
      default: "none"
      doc: "The function name goes on a new line after its return type: never, for declarations and definitions outside classes (`top_level`), for all, or for definitions only (`top_level_definitions`, `all_definitions`)."
  - short_enums:
      default: true
      doc: "An enum whose body fits stays on one line."
      kinds:
        fit: [EnumSpecifier]
  - penalty_return_type:
      range: [0, 1000]
      default: 60
      doc: "What a return type on a line of its own costs the layout; the higher, the longer the parameter list may wrap before the return type moves."
  - space_before_parens:
      values: ["never", "control_statements", "always"]
      default: "control_statements"
      doc: "A blank before the parenthesis of `if`, `for`, `while`, `switch` and `catch` (`control_statements`), before every parenthesis (`always`) or never."
  - spaces_before_trailing_comments:
      range: [0, 16]
      default: 1
      doc: "Blanks between the code of a line and its `//` comment."
  - align_trailing_comments:
      default: true
      doc: "Align the trailing comments of consecutive lines."
  - break_template_declarations:
      values: ["yes", "multiline", "no"]
      default: "multiline"
      doc: "`template <...>` ends its line: always (`yes`), when the declaration is not on one line (`multiline`) or never."
      kinds:
        break_after: [TemplateDeclaration]
        head: [TemplateParameters]
  - align_escaped_newlines:
      values: ["right", "left", "dont_align"]
      default: "right"
      doc: "The backslashes of a multi-line macro: aligned at `line_width` (`right`), one blank after the longest line (`left`) or one blank after each line."
      kinds:
        relay: [Directive]
        relay_head: [ParenGroup]
presets: [google, chromium, mozilla, webkit, gnu, microsoft]
