vscode-languages: [makefile]
grammar-crate: tree-sitter-make
grammar-path: grammars/tree-sitter-make
extensions: [mk, mak]
file-names: [Makefile, GNUmakefile, makefile]
formatter: MakefileFormatter
families: "&[core_rules::max::FAMILY]"
composite:
  text: Word
  continuation: true
dev-deps: [core-config, core-incremental, lang-shell]
options:
  - indent_size: 2
  - indent_style
  - final_newline: true
  - end_of_line
  - space_around_assignment:
      default: true
      doc: "Write `A := b` rather than `A:=b`."
  - space_before_colon:
      default: false
      doc: "Write `target : prerequisite` rather than `target: prerequisite`."
  - max_blank_lines: [2, "Largest number of blank lines kept between statements and comments."]
  - keep_comment_gap:
      default: false
      doc: "A comment after code keeps the blanks the source has before it when they are more than one."
  - spaced_assignments:
      values: ["all", "plain"]
      default: "all"
      doc: "The assignments `space_around_assignment` applies to: `all`; `plain`: those at the start of a line whose name is letters, digits and underscores, with no substitution reference `$(v:a=b)` on the line and no colon in the first word of a value that follows `=` at once (`A=b:c`, unless a URL, a time or a path). Any other (an indented one, one after `export` or `override`, a target-specific one, a name with `-`, `.`, `/` or a reference) keeps its blanks as written."
  - conditional_body_indent:
      values: ["keep", "indent"]
      default: "keep"
      doc: "The lines inside a conditional (`ifeq` ... `endif`) outside a recipe: `keep` leaves their indentation as written; `indent` indents the body one level (`indent_size`, `indent_style`) per nesting."
  - continued_line_indent:
      values: ["keep", "indent", "first"]
      default: "keep"
      doc: "The lines after the first of a rule, directive, variable value or recipe command written over several lines: `keep` leaves their indentation as written; `indent` indents the lines of a rule or directive one level; `first` gives every line the indentation of the second (a recipe command that has a shell block keyword, and a line that starts inside quotes, keep theirs)."
presets: [checkmake, mbake]
mapping:
  same: 'comment rule targets recipe recipe_line shell_text conditional word'
  Document: makefile
  Prereqs: prerequisites pattern_list
  Assign: variable_assignment shell_assignment RECIPEPREFIX_assignment VPATH_assignment
  Define: define_directive
  Call: function_call shell_function
  Directive: include_directive export_directive unexport_directive override_directive private_directive undefine_directive vpath_directive ifdef_directive ifndef_directive ifeq_directive ifneq_directive
  Else: else_directive elsif_directive
  Word: 'string concatenation archive .RECIPEPREFIX VPATH'
  MakeRef: variable_reference automatic_variable substitution_reference
  MakeEscape: escape
  Value: text shell_command
  Raw: raw_text
  Tab: ["\t"]
  Colon: ': :: &:'
  Prefix: '@ - +'
  Op: '= := ::= ?= += !='
  Keyword: 'include -include sinclude export unexport override private define endef undefine vpath ifdef ifndef ifeq ifneq else endif'
