extensions: [java]
formatter: JavaFormatter
parse: parser::parse_file
families: "&[core_rules::regex_source::FAMILY]"
options:
  - indent_size: 2
  - line_width: 100
  - indent_style
  - final_newline: true
  - end_of_line
  - member_chain_min_calls: [2]
  - member_chain_keep_accesses: ["head"]
  - member_chain_break_on_block: ["any"]
  - member_chain_head_calls: [["stream"]]
  - member_chain_short_head: [4]
  - member_chain_indent: [2]
  - binary_operator_line: ["start"]
  - binary_indent: [2]
  - binary_hug: ["never"]
  - indent_nested_binary: [true]
  - assignment_layout: ["break"]
  - assignment_conditional: ["always"]
  - assignment_indent: [2]
  - conditional_indent: [2]
  - conditional_layout: ["indented"]
presets: [google]
