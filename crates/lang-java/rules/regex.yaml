id: no-control-regex
family: regex
params: { check: control }
message: "Unexpected control character(s) in regular expression: {name}."
description: "A control character (below U+0020) in the constant string given to `Pattern.compile` and the other methods of `Pattern`, written raw or as an escape."
example: "Pattern.compile(\"\\u001f\");   // reported"
severity: off
category: suspicious
---
id: no-regex-spaces
family: regex
params: { check: spaces }
message: "Spaces are hard to count. Use {{name}}."
description: "Two or more spaces outside a character class in the string given to `Pattern.compile` and the other methods of `Pattern`."
example: "Pattern.compile(\"a  b\");   // reported"
severity: off
category: suspicious
---
id: no-misleading-character-class
family: regex
params: { check: misleading-class }
message: "Unexpected combined character in character class."
description: "A character class in the constant string given to `Pattern.compile` and the other methods of `Pattern`, in which a combining mark follows another character."
example: "Pattern.compile(\"[a\\u0301]\");   // reported"
severity: off
category: suspicious
