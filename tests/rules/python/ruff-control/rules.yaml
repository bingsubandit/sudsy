no-broad-catch: { level: warn, options: { types: [Exception, BaseException] } }
collapsible-if: warn
no-empty-catch: warn
no-debugger: warn
needless-bool: warn
if-with-same-arms: warn
open-file-without-with: warn
nested-with: warn
no-throw-generic: warn
type-check-without-type-error: warn
