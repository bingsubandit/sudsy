differences:
  empty-recipe: "choice  a rule with an explicit empty recipe (`$(OBJS): ;`) has a body; checkmake reads it as none"
  target-specific-variable: choice  a target-specific variable assignment is a variable; checkmake does not read it as one
  double-colon-rule: choice  a repeated `::` rule is allowed, as make does; checkmake reports it
  multi-target-rule: choice  each target of a rule like `c d:` is checked on its own; checkmake reads one target named `c d`
  comment-before-recipe: choice  the tool reads a target whose recipe follows comment lines as having none; make attaches the recipe to the target
  phony-line-after: choice  the tool reports a missing .PHONY target on the line after the last `.PHONY` line; Sudsy reports the `.PHONY` line itself
  rule-in-define: choice  the tool reads the lines inside a `define` block as rules; they are the text of a macro
  rule-in-variable-value: choice  the tool reads `name:VAR` lines inside a multi-line variable value as rules; they are the text of a variable
  phony-continuation: choice  the tool does not read the lines a `.PHONY` list continues over with a backslash; they declare targets
  variable-target: choice  a rule whose target is a variable that expands to file names only adds a prerequisite; the tool reports it as needing PHONY
