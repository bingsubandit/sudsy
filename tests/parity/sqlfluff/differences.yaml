differences:
  parse-gap: gap  "our parser does not parse what sqlfluff's does (a statement it lacks, `DELIMITER`, template tags), so the file is refused"
  layout-gap: gap  "the layout of our own does not yet cover every construct (expressions, joins, CASE, CTEs, comments), those parts stay as written"
files:
  sqlfluff-ansi: parse-gap, layout-gap
  sqlfluff-mysql: parse-gap, layout-gap
  sqlfluff-postgres: parse-gap, layout-gap
  sqlfluff-tsql: parse-gap, layout-gap
  postgres-regress: parse-gap, layout-gap
ratchet:
  sqlfluff-ansi: 203
  sqlfluff-mysql: 208
  sqlfluff-postgres: 122
  sqlfluff-tsql: 108
  postgres-regress: 37
rejected: invalid-input  # a file the tool rejects is not compared (the tool rejecting it is the evidence)
coverage: 4.4  # share of the default-set findings of sqlfluff on its corpus that Sudsy also reports with the preset that mirrors it (scripts/parity.sh coverage sqlfluff; at least 85% is the bar)
