differences:
  hugo-template-tokens: "choice  the tool reads the text of a Hugo template inside a tag (`{{`, `}}`, `end`, `with`, `.Level`, `(eq`) as attribute, class or element names; the file is a template, not HTML, and no real attribute is repeated outside a template action"
  action-text: choice  the tool reads the text of a `{{ }}` action as markup (a tag or comment inside a string) and its words as elements; the action is one piece of text and stays as written
  action-attribute: choice  the tool counts the words of a `{{ if }}` action among the attributes of a tag as attributes; Sudsy keeps the action as one attribute
  front-matter: choice  the tool reads the front matter between the two `---` lines as text to indent; it is data of the page generator and stays as written
  textarea-value: choice  the tool indents the text of a `<textarea>` (its ignore list names `pre` and `xmp` only); the text is the value of the field, so reindenting changes it
