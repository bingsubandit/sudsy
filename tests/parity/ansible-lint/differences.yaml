differences:
  jinja-templates: "gap  Jinja2 expressions are not parsed, so `jinja[spacing]`, `name[template]` and `jinja[invalid]` are not reported (533 findings)"
  yamllint-mirrors: "gap  the yamllint mirrors of the tool's own yamllint run `yaml[brackets]`, `yaml[colons]`, `yaml[empty-lines]` and `yaml[new-line-at-end-of-file]` are not in the preset (357 findings)"
  module-tables: "gap  the rules that read a module table (`risky-file-permissions`, `command-instead-of-shell`, `command-instead-of-module`, `package-latest`, `latest[git]`, `no-handler`) are not built (335 findings)"
  tool-crash: "gap  ansible-lint stops with a DuplicateKeyError on repeated merge keys in community.postgresql: its 60 files have no report and leave the corpus"
  extra-silent-files: "gap  Sudsy reports more lines than ansible-lint in the same rules: the tool is silent in files with a project config (`.yamllint`, `skip_list`) or a syntax-check failure, and in flush sequences when the project relaxes `indent-sequences` (block-indentation 58.6% of its lines are extra)"
target: 86.5  # the same share on the target number (docs/ai/design/parity-target.md); scripts/parity.sh coverage ansible-lint
