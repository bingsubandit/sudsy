differences:
  script-line: gap  a script rule is reported at the line of the text of a block scalar; actionlint reports it at the line of the `|`
  needs-location: gap  an unknown `needs` entry is reported at the entry; actionlint reports it at the job
  self-hosted-labels: gap  a job with `self-hosted` is not checked for custom runner labels; actionlint wants them in its config
files:
  deprecated-commands/cases actionlint:deprecated-commands 5: script-line
  deprecated-commands/cases sudsy:deprecated-commands 6: script-line
  script-injection/cases actionlint:script-injection 5: script-line
  script-injection/cases sudsy:script-injection 6: script-line
  script-injection/cases sudsy:script-injection 7: script-line
  corpus/actionlint/testdata/err/github_script_untrusted_input.yaml actionlint:script-injection 11: script-line
  corpus/actionlint/testdata/err/github_script_untrusted_input.yaml sudsy:script-injection 16: script-line
  unknown-needs/cases actionlint:unknown-needs 7: needs-location
  unknown-needs/cases sudsy:unknown-needs 8: needs-location
  corpus/actionlint/testdata/examples/invalid_ids_in_needs.yaml actionlint:unknown-needs 8: needs-location
  corpus/actionlint/testdata/examples/invalid_ids_in_needs.yaml sudsy:unknown-needs 9: needs-location
  invalid-runs-on/cases actionlint:invalid-runs-on 7: self-hosted-labels
coverage: 5.1  # share of the default-set findings of actionlint on its corpus that Sudsy also reports with the preset that mirrors it (scripts/parity.sh coverage actionlint; at least 85% is the bar)
target: 5.1
missed:  # lint rule -> findings of the corpus it misses, the top rules (scripts/parity.sh coverage <tool> checks it; COVERAGE_WRITE=1 writes it)
  syntax-check: 235
  expression/types: 155
  events: 115
  action: 41
  glob: 22
  if-cond: 21
  matrix: 19
  permissions: 19
  syntax-check/duplicate-key: 16
  credentials: 6
  runner-label/conflict: 6
  workflow-call: 6
  runner-label/unknown: 5
  expression/untrusted: 4
  id/step: 4
