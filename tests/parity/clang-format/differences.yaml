fixes:
  sort-using-declarations: "an option in shared Rust next to import ordering, or turn it off in the styles like SortIncludes"
  pointer-align: "pointer_alignment as [space] rows by parent kind (Declarator, Parameter, Cast); `a * b` stays an operator"
  reference-align: "the same rows as pointer-align for `&` and `&&`"
  binary-op-space: "[space] rows for the operators of Binary nodes; directive conditions need the expression parse of `#if` lines"
  braced-list-padding: "[space] rows after `{` and before `}` of InitList nodes, one padding option"
  cast-space: "[space] row after the `)` of a Cast; Cast is opaque in the deep parse, so give it its parts"
  brace-own-line-in-reference: "a `name(args) {` is a function brace unless the name is in for_each_macros (done); what is left: the empty-body and init-list cases of the reference (`= {` after a wrap), `case X: {` and class heads wrapped by width"
  angle-space: "[space] rows by node (TemplateArguments, TemplateParameters, Binary); directive conditions as in binary-op-space"
  comment-line-indent-or-join: "comment_gap rows: a comment takes the indent of the next line of code in the shared comment engine"
  empty-body-braces: "split_empty_braces (done for wrapped function, class, namespace); what is left: styles whose empty body is `{ }` or `{}` by their own rule"
  trailing-comment-spacing: "align_trailing_comments run rules: where a run ends and how wide the pad is"
  continuation-indent-of-non-wrap-line: "ForEachMacros and StatementMacros as lang.yaml word lists read by the shared role pass; labels by the indent_goto_labels rows"
  angle-brackets-merged-by-reference: "decide: join `> >` of closing template brackets (C++11 and later) in the printer, or let the comparison read both as equal"
  space-before-paren: "space_before_parens exists; add the keyword and macro word lists as rows (sizeof, alignof, decltype, co_await, ForEachMacros)"
  statement-joined-by-reference: "treat a MacroStatement from the ForEachMacros list as a loop head"
  ternary-colon-space: "[space] row Question-Colon: no blank when adjacent"
  brace-own-line-in-source: "check the `attach` kind sets for the member function in a class, the linkage specification and lines the deep parse leaves opaque"
  comma-space: "[space] Comma rows inside Directive nodes"
  spacing-rare: "one [space] row each"
  call-after-paren-space: "[space] row Rpar-Lpar of a Call"
  statement-split-by-reference: "StatementMacros and attribute macros as word lists; no rule needed for the others"
  blank-before-close-brace: "[blank] row: none before a `}` of a Block"
  preprocessor-token-space: "[space] rows for Hash and HashHash inside Directive nodes"
  format-off: "read `clang-format off` and `on` as the ranges of the shared ignore mechanism (core-format ignore.rs foreign markers)"
  assignment-space: "[space] rows for the initializer parts of Declarator and Parameter"
  string-macro-space: "[space] row String-Ident"
  blank-lines-other: "[blank] rows, one option each"
  token-change: "none: the pairs are listed (62 `> >` as `>>` are their own gap, 14 are the using sort, the rest are two split strings and two comments); no meaning bug"
  escaped-newline-align: "a payload mode of the shared directive layout that drops the source breaks inside a statement (a statement of the body is one flow, then wrapped)"
