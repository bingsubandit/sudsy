  SummaryJavadoc: "cause: no rule. `doc-summary` check on the shared doc-comment parser: first sentence ends with a period, no forbidden fragment"
  TodoFormat: "cause: no rule. Pattern rule on comments: `TODO` in capitals followed by a colon"
  MissingJavadocType: "cause: no rule. `missing-doc-comment` on types (all enclosing types public or protected)"
  AbbreviationAsWordInName: "cause: no rule. Naming family check: more than N consecutive capitals in a name"
  ArrayBracketNoWhitespace: "cause: no rule. Token pattern rule on `[` and `]` spacing"
  IllegalTokenText: "cause: no rule. Pattern rule on string and char literals: octal or Unicode escapes that have a short escape, whitespace other than the ASCII space"
  AvoidEscapedUnicodeCharacters: "cause: no rule. Pattern rule on string and char literals: a `\\uXXXX` escape of a printable character"
  VariableDeclarationUsageDistance: "cause: no rule. Scope family: statements between a local's declaration and its first use"
  NonConstantFieldName: "cause: no rule. Naming rows: Google's pattern for non-constant fields (`static` non-final)"
  SingleSpaceSeparator: "cause: no rule. Token pattern rule: one space between tokens on a line"
  JavadocMissingLeadingAsterisk: "cause: no rule. Check on the shared doc-comment parser"
  JavadocTagContinuationIndentation: "cause: no rule. Check on the shared doc-comment parser"
