differences:
  literal-lines-moved: choice  RuboCop's cops that shift a block (MultilineMethodCallIndentation, FirstArgumentIndentation, ClosingParenthesisIndentation) also move the lines inside a multi-line regex or heredoc that the block holds, which changes the value (rails/railties/test/generators/actions_test.rb, a `/x` regex with interpolation, has the line `^` at 10 blanks and RuboCop writes it at 8; the Prism tree of the regex differs); Sudsy never moves a line of a multi-line token
  heredoc-trailing-blank: choice  RuboCop's TrailingWhitespace deletes the blank at the end of a line inside a `<<-` heredoc, which changes the string (discourse/plugins/chat/lib/chat/user_notifications_extension.rb has `SELECT min_unread_id ` in a SQL body and RuboCop writes `SELECT min_unread_id`); Sudsy keeps the body as written
  infinite-loop: choice  RuboCop stops on discourse/plugins/discourse-ai/app/models/llm_credit_allocation.rb with `Infinite loop detected` (EmptyLinesAroundClassBody and EmptyLinesAroundAccessModifier undo each other), reports an error and still writes a file that differs from the input, so there is no stable output to compare with; Sudsy's output is pinned
