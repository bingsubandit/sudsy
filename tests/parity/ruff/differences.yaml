differences:
  fmt-directives: "gap  44 files first differ here: `# fmt: off` / `# fmt: on` / `# fmt: skip` regions: skip on compound headers and bodies on the header line, off inside brackets, blank lines around a region. fix: extend the shared ignore rows to ruff region rules (header skip, bracket-level off) and read the blank-line policy of a region from lang.yaml"
  blank-lines: "gap  28 files first differ here: blank lines around comments, decorators, stub bodies and after a block opener that ruff keeps or adds differently. fix: blank-line rules per comment placement in the shared block layout, read as options; also open: a function body keeps a blank line before its first comment, no blank line before the first `case` of a `match` (+3 files once the block blank rules are on the shared shapes)"
  comment-placement: "gap  59 files first differ here: comments in unusual places (after an operator, between `lambda` and its body, after a bracket, around keywords) and trailing comments that count for the width. fix: dangling-comment placement in the shared comments engine with a per-construct option"
  binary-layout: "gap  19 files first differ here: binary and boolean chains: which operator breaks, mixed operator levels and implicit string operands, long `**` chains, comparisons whose last operand is a bracket. fix: finish the port of the can-omit-optional-parentheses visitor (attribute precedence, first and last operand) in the shared maybe_parenthesize shape"
  misc: "gap  17 files first differ here: single-cause layouts: return annotations, lambda bodies, subscripts, del and return tuples, type parameter defaults, unicode escapes, power operand spacing. fix: one shape rule each"
  docstring: "gap  13 files first differ here: docstring edge cases: the closing quotes of a docstring that fills the line, quotes and escapes at the end, code in docstrings. fix: docstring exact-fit rule and a docstring-code option in the shared string layout"
  implicit-concat: "gap  17 files first differ here: implicit string concatenation inside a binary operand, argument or assignment: join, split and parenthesization differ. fix: the implicit-concatenation group of the shared binary chain"
  bracket-split: "gap  16 files first differ here: which bracket splits first when a call, subscript or collection ends a line (hugging, nested subscripts, first-line width). fix: best-fit layout of the last bracket in the shared delimited_list shape"
  fstring-quotes: "gap  13 files first differ here: quotes of strings inside f-string replacement fields and nested f-strings. fix: f-string replacement field normalisation in the shared string literal code"
