differences:
  code-span-backticks: gap  a code span with three backticks (tree-sitter-md does not read it as code) is kept; Prettier writes one backtick
  list-looseness: gap  a list item holding a paragraph, a nested list and an indented continuation keeps the blank lines of the source; Prettier's looseness differs
  tab-blocks: gap  a block with a tab is kept as written (the width of a tab depends on its column); Prettier re-indents the nested list
  code-span-lines: gap  a code span over two lines in a list item keeps the text of the span; Prettier removes the indentation of the second line
  code-trailing-blanks: gap  trailing blanks inside a code block are code and stay; Prettier removes them
  html-after-table: gap  an HTML block right after a table gets a blank line in front; Prettier keeps it on the next line (both parse it as HTML)
  graphql-comment-position: gap  comments between the interfaces and the `{` stay in front of the `{` where Prettier moves them into the body
files:
  runtime-docs/coding-guidelines/adding-api-guidelines.md: code-span-backticks
  runtime-docs/coding-guidelines/coding-style.md: code-span-backticks
  docs/ai/design/parity-target.md: list-looseness
  runtime-docs/coding-guidelines/breaking-change-rules.md: list-looseness
  runtime-docs/coding-guidelines/clr-code-guide.md: tab-blocks
  runtime-docs/coding-guidelines/EventLogging.md: tab-blocks
  runtime-docs/coding-guidelines/mono-code-guide.md: code-span-lines
  runtime-docs/coding-guidelines/vectorization-guidelines.md: code-trailing-blanks
  docs/ai/formatting/csharp.md: html-after-table
  graphql/prettier/tests/format/graphql/interface/separator-detection.graphql: graphql-comment-position
flags:
  no-config: the tool runs with `--no-config` (and no editorconfig), so a project's own Prettier options are not applied; Sudsy's JS, CSS and HTML options for them are not mapped yet
  embedded-language-formatting-off: "Prettier runs with `--embedded-language-formatting=off` and the folder's sudsy.yaml sets `embedded_language_formatting: off`: the formatters of the fenced languages make other choices than Prettier's"
