ratchet:
  real-world: 4666
target-files:
  real-world: 5776
second-format:
  real-world: 0
refused:
  real-world: 0
coverage: 13.0  # share of the default-set findings of ktlint on its corpus that Sudsy also reports with the preset that mirrors it (scripts/parity.sh coverage ktlint; at least 85% is the bar)
target: 11.9
differences:
  kt-dot-chain-ktlint-breaks: "gap  ktlint breaks a chain at its dots, Sudsy keeps it on a line (or keeps the head with its first accesses); fix: the wrapped chain policy: break property accesses too when the chain breaks"
  kt-comment-indent: "gap  continuation lines of a block comment are aligned differently; fix: align `*` lines of a block comment to the comment's column plus one, as ktlint does, in the cases it does"
  kt-semi-or-comma: "gap  `;` and `,` placement: single-line `enum class` kept on one line, trailing comma or `;` after enum entries; fix: keep a single-line enum body on its line when it fits (shared option), then check `;` after entries"
  kt-comment-placement: "gap  a comment moves to another line or position (trailing comment, comment before `{` or `else`); fix: keep a trailing comment on the line it follows (shared comment placement option)"
  kt-other: "gap  cause not classified yet; fix: classify further (oth.py)"
  kt-break-after-ktlint: "gap  ktlint breaks after `=` or `->`, Sudsy keeps the value on the line; fix: a shared assignment option: break after `=` when the value is a multi-line chain or lambda call"
  kt-block-comment-to-line: "gap  ktlint turns a block comment into line comments; fix: a shared comment-conversion option for single-line block comments"
  kt-blank-ktlint-extra: "gap  ktlint keeps a blank line from the source (after a lambda arrow, between `when` entries, before a comment, after a typealias) that Sudsy removes; fix: keep source blank lines in lambda bodies and `when` bodies (shared blank option)"
  kt-break-after-sudsy: "gap  Sudsy breaks after `=` or `->`, ktlint keeps the value on the line; fix: stop breaking after `=` when the value starts with a call that fits"
  kt-blank-sudsy-extra: "gap  Sudsy inserts a blank line ktlint does not (between consecutive declarations of a kind, before a comment); fix: drop the forced blank between consecutive one-line declarations (blank rows)"
  kt-ws-other: "gap  blanks inside a line differ; fix: classify further"
  kt-class-header: "gap  the header of a class (constructor, supertypes, `where`) is wrapped differently; fix: sample the headers, then extend the shared heritage layout"
  kt-dot-chain-sudsy: "gap  Sudsy breaks a chain at its dots, ktlint keeps it on a line; fix: keep a chain flat when it fits and has few calls"
  kt-unit: "gap  `: Unit` of a block-body function is removed by ktlint (no-unit-return); added to an expression body that throws; fix: a shared rule `redundant-return-type` with the option value `Unit`, run by the formatter (`format_rules`)"
  kt-if-else-other: "gap  an `if`/`else` is braced or laid out differently (an `if` expression that fits on a line stays unbraced in ktlint); fix: the shared curly rule: an `if`/`else` expression that fits stays unbraced"
  kt-expr-vs-block-body: "gap  a function body is an expression in one output and a block with `return` in the other; fix: the shared expression-body rule: convert a block that is one `return` of a multi-line expression"
  kt-lambda-arg-hug: "gap  ktlint keeps lambda arguments hugged (`f({ ... }, { ... })`), Sudsy breaks every argument; fix: a shared call-argument option: hug lambdas when the source does"
  kt-parens: "gap  parentheses are added or removed; fix: classify further"
  kt-import: "gap  an import line or the blank line around imports differs (import order, a wildcard import); fix: classify further (import ordering)"
  kt-comment-other: "gap  a comment differs in a way not classified yet; fix: classify further"
  kt-binary-chain: "gap  a binary operator chain breaks differently; fix: a shared binary chain option"
  kt-annotation-line: "gap  an annotation is on its own line in one output and with the declaration in the other; fix: classify further"
  kt-indent-other: "gap  indentation differs, cause not classified yet; fix: classify further (ind.py) before fixing"
  kt-raw-string-lines: "gap  lines of a raw string or `trimMargin` text are re-indented differently; fix: reindent the text of a `trimMargin` raw string like `trimIndent` (a call-name option row)"
  kt-closer-indent: "gap  a closing parenthesis or bracket, or the lines up to it, are indented differently; fix: sample the cases, then fix the closing line's indent in the shared list layout"
  kt-array-hug: "gap  an annotation argument array stays on the `=` line in ktlint (`foo = [`); fix: a shared option: keep `name = [` on the `=` line in annotation arguments"
  kt-line-added-removed: "gap  a line exists in one output only (cause not classified yet); fix: classify further"
  kt-declaration-body-nesting: "gap  the body of a declaration whose header was wrapped (`actual constructor`, supertypes below the name) sits one level deeper in ktlint; fix: indent the body one level when the header wraps below the name (shared heritage layout, `actual constructor` kind option)"
  kt-chain-lambda-continuation: "gap  the body of a lambda after `}.name {` in a chain is indented one level too deep; fix: indent the lambda body of `}.name {` at the chain's own level, not one more"
  kt-template-braces: "gap  `${name}` is written as `$name` by ktlint; fix: a shared rule: `${name}` to `$name` when no identifier char follows"
  kt-if-add-braces: "gap  ktlint braces a branch that Sudsy leaves bare; fix: the shared curly rule"
  kt-brace-placement: "gap  a `{` is on another line; fix: classify further"
  kt-break-after-k: "gap  ktlint breaks after `=` of a value with a multi-line call or lambda; fix: see break-after-=/->(ktlint)"
  kt-empty-braces: "gap  `{}` handling differs; fix: classify further"
  kt-if-else-braced: "gap  ktlint braces an `if`/`else` that Sudsy leaves bare, or the reverse; fix: the shared curly rule"
  kt-lambda-other: "gap  a lambda is laid out differently, cause not classified yet; fix: classify further"
  kt-break-after-s: "gap  Sudsy breaks after `=` where ktlint does not; fix: see break-after-=/->(sudsy)"
  kt-ctor-annot-header: "gap  the annotated constructor header differs; fix: classify further"
  kt-closing-paren-line: "gap  a closing parenthesis is on its own line in one output only; fix: classify further"
