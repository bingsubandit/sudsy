differences:
  shell-layout: gap  the shell text of RUN, CMD, ENTRYPOINT and HEALTHCHECK is kept as written (continued lines keep their relative indent); dockerfmt lays it out with mvdan/sh (`&&` at the line start, one level of nesting, joined and split lines)
  env-legacy: gap  `ENV key value` is kept; dockerfmt writes `ENV key=value`
  copy-json: gap  `COPY ["a", "b"]` and `ADD [...]` stay in JSON form; dockerfmt writes plain arguments when the form has no JSON-only meaning
  comment-space: gap  `#word` is kept; dockerfmt writes `# word` (a letter or digit after the `#`)
  blank-lines: gap  a blank line at the start of a file is dropped, and blanks between instructions follow `max_blank_lines`; dockerfmt keeps one leading blank line
  copy-layout: gap  a continued COPY, ADD or SHELL keeps its arguments as written; dockerfmt puts every argument on a line of its own
  maintainer: gap  `MAINTAINER x` is kept; dockerfmt writes `LABEL org.opencontainers.image.authors="x"`, which changes metadata and is not done
