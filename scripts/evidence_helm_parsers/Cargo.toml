[package]
name = "evidence-helm-parsers"
version = "0.0.0"
edition = "2024"
publish = false
description = "Parse measurement of the Helm template candidates (docs/ai/design/helm.md); not part of the Sudsy workspace"
autobins = false

# its own workspace: the root Cargo.toml does not list it
[workspace]

# the sources sit next to this file (not in src/bin: the root .gitignore ignores every bin/ folder)
[lib]
path = "lib.rs"

# one binary per candidate, each linking only its own parser (binary size): `--features ts --bin ts` and so on
[[bin]]
name = "base"
path = "base.rs"

[[bin]]
name = "ts"
path = "ts.rs"
required-features = ["ts"]

[[bin]]
name = "hand"
path = "hand.rs"

[features]
default = []
ts = ["dep:tree-sitter", "dep:tree-sitter-language"]

[dependencies]
# the runtime that reads LANGUAGE_VERSION 15 (the go-template parser is generated by a 2026 tree-sitter CLI)
tree-sitter = { version = "0.25", optional = true }
tree-sitter-language = { version = "0.1", optional = true }

[build-dependencies]
cc = "1"

# release with LTO, as the language step asks (docs/ai/architecture/adding-a-language.md)
[profile.release]
lto = true
codegen-units = 1
strip = true
