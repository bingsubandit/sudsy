[package]
name = "tree-sitter-containerfile"
description = "Containerfile and Dockerfile grammar for tree-sitter (fork of tree-sitter-containerfile 0.9.2, see FORK.md)"
version = "0.9.2"
license = "MIT"
edition.workspace = true
publish = false
autoexamples = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1.8"

[build-dependencies]
cc = "1.2"
