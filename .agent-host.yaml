# Profile for the Linux agent host (github.com/bingsubandit/agent-host): docs/development/dev-loop.md#linux-agent-host
name: sudsy
max_agents: 4
setup: [scripts/agent-host/setup.sh, scripts/agent-host/caveman.sh]  # one script per use case, in order
warm: scripts/agent-host/warm.sh
worktree_env:
  CARGO_TARGET_DIR: "{slot}"
  SUDSY_SLOT_MAX: 100GB
busy_processes: [cargo, rustc, dotnet, node]
metrics:  # command classes `ahost metrics` times per instance type, cold and warm
  gate: 'scripts/gate\.sh'
  finish: 'scripts/finish\.sh'
  bench: 'scripts/bench\.sh'
  parity: 'scripts/parity\.sh'
  build: '\bcargo (build|test|nextest|clippy|check)\b'
