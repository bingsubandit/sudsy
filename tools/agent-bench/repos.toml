# The bench's repositories, each pinned at a commit (every task's commit is an ancestor of the pin),
# with its own tools for the native arms. `fetch.py` clones them (blobless) into cache/ and
# builds each tool environment from the versions here.
#
# Per family (`native`, `sudsy`):
#   check, fix   the commands the instructions name (run from the repository root, no arguments added)
#   hook_fix     what the stop hook runs on the changed files (default: fix)
#   lint         machine-readable lint of a file list for the verifier: cmd + parser (ruff, eslint, govet, sudsy)
#   format_check a command that exits non-zero (or, with `output_fails`, prints something) when {file} is not formatted
#   hook_lint    what the post-edit hook runs on the edited file (native: through hook.py)
#   hook_stop    the stop hook's command, when the family has its own (sudsy); else hook.py runs hook_fix
#   exts         the files the family's tools handle
# [sudsy] below is the default of every repo; a repo's `sudsy_extra` adds the tools Sudsy does not
# replace there (gofmt for Go, which Sudsy lints but does not format).

[sudsy]
check = ["sudsy check"]
fix = ["sudsy fix", "sudsy fix --unsafe", "sudsy fix --apply ID"]
hook_fix = ["sudsy fix"]
lint = { cmd = "sudsy lint --format json {files}", parse = "sudsy" }
format_check = { cmd = "sudsy format --check {file}" }
hook_lint = "sudsy hook post-edit"
hook_stop = ["sudsy hook stop"]
# the sudsy arms start from `sudsy init -y` plus the repo's `sudsy_init`: the presets closest to its
# native rule set (Sudsy does not import ruff or flat ESLint configs yet)
exts = [
  ".py",
  ".ts",
  ".js",
  ".mjs",
  ".json",
  ".yaml",
  ".yml",
  ".md",
  ".toml",
  ".go",
  ".sh",
  "Dockerfile",
]

[repo.click]
url = "https://github.com/pallets/click"
pin = "08b803cf32ceb2ae6a772c62d5da42757a897d44"
language = "python"
python = ["ruff==0.15.9", "pytest==9.0.2"] # click's uv.lock
env = { PYTHONPATH = "src" }
test = "python -m pytest"
sudsy_init = "--preset python/ruff"
[repo.click.native]
check = ["ruff check", "ruff format --check"]
fix = ["ruff check --fix", "ruff format"]
lint = { cmd = "ruff check --no-fix --output-format json {files}", parse = "ruff" }
format_check = { cmd = "ruff format --check {file}" }
hook_lint = "ruff check --no-fix --output-format concise {file}"
exts = [".py"]

[repo.humanize]
url = "https://github.com/python-humanize/humanize"
pin = "a95004512dde4e8f0269946bb4af754382347441"
language = "python"
python = ["ruff==0.17.4", "black==26.10.1", "pytest==9.1.1", "freezegun==1.5.5"]
env = { PYTHONPATH = "src" }
# hatch-vcs writes the version file at build time; it is gitignored
setup = ["printf '__version__ = \"0.0.0\"\\n' > src/humanize/_version.py"]
test = "python -m pytest"
sudsy_init = "--preset python/ruff"
[repo.humanize.native]
check = ["ruff check", "black --check ."]
fix = ["ruff check --fix", "black ."]
lint = { cmd = "ruff check --no-fix --output-format json {files}", parse = "ruff" }
format_check = { cmd = "black --check -q {file}" }
hook_lint = "ruff check --no-fix --output-format concise {file}"
exts = [".py"]

[repo.ufo]
url = "https://github.com/unjs/ufo"
pin = "f06c800d0c59f2a4a1b9ba65eb6cb61a84419be6"
language = "typescript"
# node_modules installed once from the pin's pnpm-lock.yaml, linked into every run
node = "npx -y pnpm@10.33.2 install --frozen-lockfile --ignore-scripts"
test = "npx vitest run"
sudsy_init = "--preset js/eslint-recommended --preset js/typescript-eslint-recommended"
[repo.ufo.native]
check = ["npm run lint"]
fix = ["npm run lint:fix"]
lint = { cmd = "node_modules/.bin/eslint -f json {files}", parse = "eslint" }
format_check = { cmd = "node_modules/.bin/prettier -c {file}" }
hook_lint = "node_modules/.bin/eslint {file}"
exts = [".ts", ".mjs", ".js"]

[repo.chi]
url = "https://github.com/go-chi/chi"
pin = "c64ed7d6635f33a8b2feaff7dcfa55677023ac7d"
language = "go"
test = "go test ./..."
sudsy_init = "--preset go/revive"
sudsy_config = { overrides = [
  { files = [
    "**/*_test.go",
  ], go = { lint = { rules = { unused-parameter = "off" } } } },
] }
[repo.chi.native]
check = ["go vet ./...", "gofmt -l ."]
fix = ["gofmt -w ."]
lint = { cmd = "go vet {packages}", parse = "govet" }
format_check = { cmd = "gofmt -l {file}", output_fails = true }
hook_lint = "go vet {package}"
exts = [".go"]
[repo.chi.sudsy_extra]
check = ["gofmt -l ."]
fix = ["gofmt -w ."]
format_check = { cmd = "gofmt -l {file}", output_fails = true, exts = [".go"] }

[repo.pathe]
url = "https://github.com/unjs/pathe"
pin = "bc7477a01f0bd60ada017add8142c9f9d69ccdc5"
language = "typescript"
# zeptomatch: the glob dependency of the start trees older than the built-in matcher (55a21be)
node = "npx -y pnpm@11.10.0 install --frozen-lockfile --ignore-scripts && npx -y pnpm@11.10.0 add -D zeptomatch@2.1.0 --ignore-scripts"
test = "npx vitest run"
sudsy_init = "--preset js/oxlint --preset js/eslint-recommended"
[repo.pathe.native]
check = ["npm run lint"]
fix = ["npm run lint:fix"]
lint = { cmd = "node_modules/.bin/oxlint -f json {files}", parse = "oxlint" }
format_check = { cmd = "node_modules/.bin/oxfmt --check {file}" }
hook_lint = "node_modules/.bin/oxlint {file}"
exts = [".ts", ".mjs", ".js"]

# the mixed repository: Python, Dockerfile, docker-compose, Prometheus and Grafana YAML, GitHub workflows,
# Markdown issue templates. Its own lint is pylint (tox's lint env); it has no formatter.
[repo.flower]
url = "https://github.com/mher/flower"
pin = "15d22672a3a71415fffc868d0f1befb936baed6d"
language = "python"
python = [
  "celery==5.7.0",
  "tornado==6.6.1",
  "prometheus-client==0.26.0",
  "humanize==4.17.0",
  "pytz==2026.6",
  "redis==8.2.0",
  "pylint==4.1.4",
]
test = "python -m unittest"
sudsy_init = "--preset python/ruff --preset dockerfile/hadolint --preset github-actions/actionlint"
# Tornado templates and the bundled static files are not HTML or JS for a formatter to touch
sudsy_config = { exclude = [
  "flower/templates/**",
  "flower/static/**",
  "docs/**",
] }
[repo.flower.native]
check = ["pylint flower --rcfile .pylintrc"]
fix = []
lint = { cmd = "pylint --rcfile .pylintrc --output-format=json {files}", parse = "pylint" }
hook_lint = "pylint --rcfile .pylintrc --score=n {file}"
exts = [".py"]
