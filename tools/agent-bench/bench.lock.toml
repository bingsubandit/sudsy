# Versions the bench runs on. A run on another Claude Code version is recorded as such and warned
# about; batches are only compared when these match.
claude_code = "2.1.332"
# --model value per mode; the exact model ids a run used are read back from its result and recorded
model = { smoke = "haiku", full = "sonnet" }
task_set = "v2"
# reps per mode; a smoke batch takes `tasks_per_pair` tasks of each pair (a seeded sample)
smoke = { reps = 2, tasks_per_pair = 4 }
full = { reps = 5 }
# per-run limits: a run that hits one counts as a failure, with its metrics kept
timeout_s = 900
max_budget_usd = { smoke = 0.5, full = 2.0 }
