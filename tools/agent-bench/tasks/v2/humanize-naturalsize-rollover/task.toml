text = """
`humanize.naturalsize(999999)` returns `"1000.0 kB"`: the suffix is picked from the unrounded value, then the mantissa rounds up to the base. When rounding reaches the base and a larger suffix exists, the next suffix must be used: `naturalsize(999999)` is `"1.0 MB"`, `naturalsize(1024**2 - 1, True)` is `"1.0 MiB"`, `naturalsize(1024**2 - 1, False, True)` is `"1.0M"`.
"""
