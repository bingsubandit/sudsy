text = '''
`format()` fails on partial objects: `format({ name: "file" })` must be `"file"`, `format({ ext: "ext" })` and `format({ ext: ".ext" })` `".ext"`, `format({ dir: "/foo", name: "file" })` `"/foo/file"`. A missing name counts as empty and an extension without its dot gets one.
