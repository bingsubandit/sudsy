repo = "pathe"
pairs = ["E7", "E3", "E3C"]
kind = "lint-debt"
tests = "npx vitest run test/utils.spec.ts test/index.spec.ts"
scope = ["src/*", "test/*"]
clean = ["src/_path.ts", "src/utils.ts"]
clean_rules = ["prefer-starts-with", "prefer-not-starts-with"]
seed_edits = [
  [
    "src/utils.ts",
    "if (alias === key || key.startsWith(alias)) {",
    "if (alias === key || key.indexOf(alias) === 0) {",
  ],
  [
    "src/utils.ts",
    "  aliases = normalizeAliases(aliases);\n  for (const [alias, to] of Object.entries(aliases)) {\n    if (!_path.startsWith(alias)) {",
    "  aliases = normalizeAliases(aliases);\n  for (const [alias, to] of Object.entries(aliases)) {\n    if (_path.indexOf(alias) !== 0) {",
  ],
  [
    "src/_path.ts",
    "(p.ext.startsWith(\".\") ? p.ext",
    "(p.ext.indexOf(\".\") === 0 ? p.ext",
  ],
]
solution_edits_sudsy = [
  [
    "src/utils.ts",
    "if (alias === key || key.indexOf(alias) === 0) {",
    "if (alias === key || key.startsWith(alias)) {",
  ],
  [
    "src/utils.ts",
    "  aliases = normalizeAliases(aliases);\n  for (const [alias, to] of Object.entries(aliases)) {\n    if (_path.indexOf(alias) !== 0) {",
    "  aliases = normalizeAliases(aliases);\n  for (const [alias, to] of Object.entries(aliases)) {\n    if (!_path.startsWith(alias)) {",
  ],
  [
    "src/_path.ts",
    "(p.ext.indexOf(\".\") === 0 ? p.ext",
    "(p.ext.startsWith(\".\") ? p.ext",
  ],
]
text = '''
The project's own rules `prefer-starts-with`, `prefer-not-starts-with` report findings in `src/`. Fix every finding of them there; leave other findings alone.
'''

[project]
config = '''
plugins:
  patterns: ["rules/*.yaml"]
'''

[project.files]
"rules/starts-with.yaml" = '''
id: prefer-starts-with
language: js
message: use `$S.startsWith($X)` instead of comparing `indexOf` with 0
description: Reports `s.indexOf(x) === 0`, which scans the whole string to answer a prefix question.
severity: warn
category: performance
rule:
  pattern: $S.indexOf($X) === 0
fix: $S.startsWith($X)
fix-kind: suggestion
---
id: prefer-not-starts-with
language: js
message: use `!$S.startsWith($X)` instead of comparing `indexOf` with 0
description: Reports `s.indexOf(x) !== 0`, which scans the whole string to answer a prefix question.
severity: warn
category: performance
rule:
  pattern: $S.indexOf($X) !== 0
fix: "!$S.startsWith($X)"
fix-kind: suggestion
'''
