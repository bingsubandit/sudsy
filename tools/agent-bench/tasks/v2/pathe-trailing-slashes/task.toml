text = '''
Align `dirname`, `extname` and `parse` with `node:path` for consecutive and trailing slashes: `dirname("a/b//")` is `"a"`, `dirname("a//b")` is `"a/"`, `dirname("aa//")` is `"."`; `extname` reads only the last segment (`extname("dir/.bashrc")` is `""`, `extname("trailing.dir/")` is `".dir"`, `extname("a/..")` is `""`); `parse("file.txt")` and `parse("file.txt/")` have an empty `dir`, not `"."`.
'''
