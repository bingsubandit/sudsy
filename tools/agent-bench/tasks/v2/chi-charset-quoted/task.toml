text = """
`middleware.ContentCharset` rejects `Content-Type: text/plain; charset="UTF-8"`: quoted charset values, other parameters before the charset (also quoted ones containing `charset=` or `;`) and mixed case are not parsed. Parse the header as a media type (`mime.ParseMediaType`) and compare the lower-cased `charset` parameter; keep the current lenient handling when the header is not a valid media type. Document quoted values on `ContentCharset`.
