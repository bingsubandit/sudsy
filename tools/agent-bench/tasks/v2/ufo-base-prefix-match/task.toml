text = """
`withBase` and `withoutBase` treat `/admin-dashboard` as if it started with the base `/admin/`. A base only matches when the input continues with `/`, `?` or ends right after it: `withBase("/admin-dashboard", "/admin/")` is `"/admin/admin-dashboard"` (also for base `"/admin"`), `withoutBase("/admin-dashboard", "/admin/")` is `"/admin-dashboard"`, while `withoutBase("/admin/dashboard", "/admin/")` stays `"/dashboard"`.
"""
