text = '''
Task search drops quotes and brackets: `BaseHandler.get_argument` HTML-escapes every string argument, so the query `args:"hello world"` (in `/api/tasks?search=...` and in the tasks page's `search[value]`) no longer matches. Keep escaping by default but let callers turn it off (`escape=False`), and use that for both search arguments.
'''
