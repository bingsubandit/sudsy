text = """
The usage line of an optional `click.argument` whose type already brackets its metavar (`Choice`, `DateTime`) shows two pairs of brackets: `Usage: cli [OPTIONS] [[foo|bar|baz]]...`. Reuse the type's brackets as the optional marker instead: `[foo|bar|baz]...` for `nargs=-1`, `[foo|bar|baz]` for `required=False`, `[%Y-%m-%d]` for a `DateTime(formats=["%Y-%m-%d"])`. Add a line to CHANGES.md.
"""
