repo = "click"
pairs = ["E7", "E3", "E3C"]
kind = "lint-debt"
tests = "python -m pytest -q -p no:cacheprovider tests/test_termui.py tests/test_utils"
scope = ["src/click/*", "tests/*"]
clean = ["src/click/termui.py"]
clean_rules = ["use-echo"]
seed_edits = [
  [
    "src/click/termui.py",
    "                echo(None, err=err)",
    "                print(None, err=err)",
  ],
  [
    "src/click/termui.py",
    "            echo(_(\"Error: {message}\").format(message=message), err=err)",
    "            print(_(\"Error: {message}\").format(message=message), err=err)",
  ],
  [
    "src/click/termui.py",
    "        echo(_(\"Error: The two entered values do not match.\"), err=err)",
    "        print(_(\"Error: The two entered values do not match.\"), err=err)",
  ],
  [
    "src/click/termui.py",
    "            echo(_(\"Error: invalid input\"), err=err)",
    "            print(_(\"Error: invalid input\"), err=err)",
  ],
  [
    "src/click/termui.py",
    "    echo(\"\\033[2J\\033[1;1H\", nl=False)",
    "    print(\"\\033[2J\\033[1;1H\", nl=False)",
  ],
]
solution_edits_sudsy = [
  [
    "src/click/termui.py",
    "                print(None, err=err)",
    "                echo(None, err=err)",
  ],
  [
    "src/click/termui.py",
    "            print(_(\"Error: {message}\").format(message=message), err=err)",
    "            echo(_(\"Error: {message}\").format(message=message), err=err)",
  ],
  [
    "src/click/termui.py",
    "        print(_(\"Error: The two entered values do not match.\"), err=err)",
    "        echo(_(\"Error: The two entered values do not match.\"), err=err)",
  ],
  [
    "src/click/termui.py",
    "            print(_(\"Error: invalid input\"), err=err)",
    "            echo(_(\"Error: invalid input\"), err=err)",
  ],
  [
    "src/click/termui.py",
    "    print(\"\\033[2J\\033[1;1H\", nl=False)",
    "    echo(\"\\033[2J\\033[1;1H\", nl=False)",
  ],
]
text = '''
The project's own rule `use-echo` reports findings in `src/click/termui.py`. Fix every finding of it there; leave other findings alone.
'''

[project]
config = '''
plugins:
  patterns: ["rules/*.yaml"]
'''

[project.files]
"rules/use-echo.yaml" = '''
id: use-echo
language: python
message: library code writes with `echo()`, not `print()`
description: Reports `print()` in the library; `echo()` handles bytes, colours, closed streams and `err=`.
severity: warn
category: suspicious
rule:
  pattern: print($$$ARGS)
fix: echo($$$ARGS)
fix-kind: suggestion
'''
