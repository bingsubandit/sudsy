text = """
Mounting a router onto itself (`r.Mount("/", r)`), or onto an inline mux derived from it with `With()`/`Group()` (they share the same routing tree), makes every unmatched request loop forever. `Mount()` must panic at registration instead, with `chi: attempting to Mount() a router onto itself on '<pattern>'`, like its other runtime-safety checks.
