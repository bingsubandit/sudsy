repo = "click"
kind = "policy"
tests = "python -m pytest -q -p no:cacheprovider tests/test_utils"
scope = [
  "pyproject.toml",
  "sudsy.yaml",
  "rules/*",
  ".sudsy/*",
  "src/click/*",
  "CHANGES.md",
]
probes = [
  { path = "src/click/_bench_probe.py", content = "def report(value):\n    print(value)\n", expect = "finding" },
  { path = "src/click/_bench_probe_ok.py", content = "from click.utils import echo\n\n\ndef report(value):\n    echo(value)\n", expect = "clean" },
  { path = "tests/test_bench_probe.py", content = "def report(value):\n    print(value)\n", expect = "clean" },
  { path = "src/click/utils.py", expect = "clean" },
]
text = """
Library code under `src/click/` must never call `print()`: its output goes through `click.echo`. Make that an
enforced rule of the project's checks, so that the checks report a `print()` call in any module of `src/click/`.
Tests may keep using `print()`.
"""
