text = """
`withoutBase("/legacy//evil.com", "/legacy")` returns `"//evil.com"`, a protocol-relative URL. After removing the base, leading slashes must collapse into one: that call returns `"/evil.com"` (also with base `"/legacy/"` or input `"/legacy///evil.com"`), and `withoutBase("/legacy//", "/legacy")` returns `"/"`.
"""
