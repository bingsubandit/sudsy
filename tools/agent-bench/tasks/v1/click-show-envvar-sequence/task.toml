text = """
Two bugs of `Option` with `show_envvar=True`. (1) When `envvar` is a list or tuple, the "missing parameter" error prints the Python list: it must name each variable, quoted, separated by commas: `'--units' (env var: 'WEATHER_UNITS', 'UNITS')`. A single string stays `(env var: 'UNITS')`. (2) An empty `envvar` (`[]` or `""`) must behave like no `envvar` at all: no `(env var: ...)` hint in the error, and in `--help` the automatic `[env var: PREFIX_NAME]` from `auto_envvar_prefix` is shown as it is for `envvar=None`. Add a line to CHANGES.md.
"""
