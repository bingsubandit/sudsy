text = """
Add an exported utility `filterQuery(input, predicate)` next to `withQuery` in `src/utils.ts`: it keeps only the query parameters for which `predicate(key, value)` returns true. `filterQuery("/foo?bar=1&baz=2", (key) => key !== "bar")` is `"/foo?baz=2"`, `filterQuery("/foo?bar=1", ...)` is `"/foo"` (no `?` left), and an input without a query is returned unchanged. Document it in the README's utils section like its neighbours.
"""
