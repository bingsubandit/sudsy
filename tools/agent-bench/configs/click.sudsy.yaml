# Every other Sudsy rule of the language is off; only the files the native tools check are included.
include:
- '**/*.py'
exclude:
- examples/**
python:
  lint:
    rules:
      ambiguous-class-name: warn
      ambiguous-function-name: warn
      ambiguous-variable-name: warn
      any-eq-parameter: 'off'
      assert-false: warn
      assert-tuple: warn
      bare-raise-outside-handler: 'off'
      boolean-literal-comparison: warn
      break-outside-loop: warn
      cached-method: warn
      collapsible-if: 'off'
      continue-outside-loop: warn
      custom-type-var-return: 'off'
      datetime-utc-alias: warn
      default-except-not-last: warn
      default-type-arguments: warn
      deprecated-import: warn
      deprecated-typing-alias: warn
      double-negation: 'off'
      explicit-return-none: 'off'
      f-string: warn
      f-string-missing-placeholders: warn
      forward-annotation-syntax-error: warn
      function-call-in-default: warn
      future-feature-not-defined: warn
      generic-class: warn
      generic-function: warn
      get-attr-with-constant: warn
      hasattr-call: warn
      if-expr-with-false-true: 'off'
      if-expr-with-true-false: 'off'
      if-expr-with-twisted-arms: 'off'
      if-tuple: warn
      if-with-same-arms: 'off'
      implicit-concat-in-collection: 'off'
      in-dict-keys: 'off'
      invalid-escape-sequence: warn
      invalid-print-syntax: warn
      invalid-syntax: 'off'
      is-literal: warn
      lambda-assignment: warn
      late-future-import: warn
      module-import-not-at-top-of-file: warn
      multiple-imports-on-one-line: warn
      multiple-starred-expressions: warn
      multiple-starts-ends-with: 'off'
      multiple-statements-on-one-line-colon: warn
      multiple-statements-on-one-line-semicolon: warn
      mutable-argument-default: warn
      mutable-class-default: 'off'
      needless-bool: 'off'
      negate-equal-op: 'off'
      negate-not-equal-op: 'off'
      nested-with: 'off'
      no-assignment-in-condition: 'off'
      no-broad-catch: warn
      no-constant-comparison: 'off'
      no-constant-condition: 'off'
      no-control-regex: 'off'
      no-debugger: 'off'
      no-duplicate-case: 'off'
      no-empty-block: 'off'
      no-empty-catch: 'off'
      no-eval: 'off'
      no-misleading-character-class: 'off'
      no-print: 'off'
      no-regex-spaces: 'off'
      no-self-assign: 'off'
      no-self-compare: 'off'
      no-throw-generic: 'off'
      no-useless-expression: warn
      no-wildcard-imports: warn
      none-comparison: warn
      not-in-test: warn
      not-is-test: warn
      open-file-without-with: 'off'
      optional-annotation: warn
      os-error-alias: warn
      outdated-version-block: warn
      percent-format-expected-mapping: warn
      percent-format-expected-sequence: warn
      percent-format-extra-named-arguments: warn
      percent-format-invalid-format: warn
      percent-format-missing-argument: warn
      percent-format-mixed-positional-and-named: warn
      percent-format-positional-count-mismatch: warn
      percent-format-star-requires-sequence: warn
      percent-format-unsupported-format-character: warn
      printf-string-formatting: warn
      quoted-annotation: warn
      raise-not-implemented: warn
      raise-without-from-inside-except: warn
      redeclared-variable: warn
      redefines-builtin-id: 'off'
      redundant-tuple-in-exception-handler: warn
      regex-flag-alias: 'off'
      return-outside-function: warn
      set-attr-with-constant: warn
      shadowed-variable: warn
      static-join: 'off'
      string-dot-format-extra-named-arguments: warn
      string-dot-format-extra-positional-arguments: warn
      string-dot-format-invalid-format: warn
      string-dot-format-missing-arguments: warn
      string-dot-format-mixing-automatic: warn
      subprocess-run-without-check: 'off'
      type-alias-annotation: warn
      type-check-without-type-error: 'off'
      type-comparison: warn
      type-var-name-variance: 'off'
      undefined-export: warn
      undefined-local-with-import-star-usage: warn
      undefined-local-with-nested-import-star-usage: warn
      undefined-variable: warn
      unicode-literal: warn
      union-annotation: warn
      unnecessary-collection-call: 'off'
      unnecessary-placeholder: 'off'
      unreachable-code: 'off'
      unsorted-dunder-all: 'off'
      unsorted-dunder-slots: 'off'
      unsorted-imports: warn
      unused-annotation: warn
      unused-import: warn
      unused-unpacked-variable: 'off'
      unused-variable: warn
      use-before-define: warn
      useless-import-alias: 'off'
      useless-object-inheritance: warn
      useless-semicolon: warn
      verbose-raise: 'off'
      yield-outside-function: warn
      zip-without-explicit-strict: warn
