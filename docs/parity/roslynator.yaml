  RCS1020: planned | Simplify Nullable<T> to T? (on). Same check as SA1125.
  RCS1018: sdk IDE0040
  RCS1019: sdk IDE0036
  RCS1060: planned | Declare each type in separate file (off). Same check as SA1402 (on there).
  RCS1094: sdk IDE0065
  RCS1110: sdk CA1050
  RCS1039: planned | Remove argument list from attribute (hidden).
  RCS1260: option csharp.format.trailing_commas
  RCS0063: formatter
  RCS0008: planned | Add blank line between closing brace and next statement (off). Same idea as SA1513/IDE2003.
  RCS1153: planned | Add empty line after closing brace (off).
  "RCS0009": "planned | Add blank line between declaration and documentation comment (off): a blank line before a `///` header, same as SA1514 (Sudsy only does it under blank_lines_between_members: separate)."
  RCS0010: option csharp.format.blank_lines_between_members | adjacent single-line members stay together
  RCS0012: option csharp.format.blank_lines_between_members | not done by `separate`
  RCS0013: option csharp.format.blank_lines_between_members | not done by `separate`
