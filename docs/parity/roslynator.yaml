tool: "roslynator"
version: "5.0.1 (NuGet Roslynator.Analyzers latest); catalogue from the repo main (clone Oct 31 2026), src/Analyzers.xml has 340 analyzer entries"
languages: ["csharp"]
sources:
  - "https://www.nuget.org/packages/Roslynator.Analyzers"
  - "https://github.com/dotnet/roslynator (src/Analyzers.xml: id, title, default severity, IsEnabledByDefault)"
  - "https://josefpihrt.github.io/docs/roslynator/analyzers"
scope: "NOT a full catalogue: only analyzers that overlap Sudsy's existing rules or the planned StyleCop rules (plus the formatting analyzers RCS0xxx that match SA layout rules). The remaining ~280 are intentionally not listed."
entries:
  RCS1075: rule no-empty-block
  RCS1046: rule async-suffix
  "RCS1047": "planned | Non-async method names should not end with Async (on by default in Roslynator). Proposal: option `unnecessary_suffix: true` on async-suffix, or a second rule `no-async-suffix`; low priority."
  RCS1084: sdk IDE0029
  RCS1128: sdk IDE0270
  RCS1173: sdk IDE0270
  RCS1148: rule unreachable-code
  RCS1213: rule unused-private-member
  RCS1179: rule unused-assignment
  RCS1212: rule unused-assignment
  RCS1202: rule possible-null-dereference
  RCS0056: rule max-line-length | no allow_non_breakable_words
  RCS0015: rule using-order | no blank-line group handling
  RCS0037: rule using-order | no blank-line group handling
  RCS0038: rule using-order | no blank-line group handling
  RCS1001: sdk IDE0011
  RCS1003: sdk IDE0011
  RCS1007: sdk IDE0011
  RCS1126: sdk IDE0011
  RCS1002: wontfix opposite of SA1503/IDE0011 true
  "RCS1038": "planned | Remove empty statement (off). Same check as SA1106 (default-on there). Merged: one rule `no-empty-statement`, StyleCop default (on, warn), safe fix."
  RCS1037: formatter
  RCS1013: sdk IDE0049
  "RCS1078": "planned | Use \"\" or string.Empty (off, default prefers \"\"; option roslynator_empty_string_style = literal|field). SA1122 requires string.Empty. Merged: one rule `empty-string-style` with option `style`."
  RCS1032: sdk IDE0047
  RCS1123: sdk IDE0048
  RCS1048: planned | Use lambda expression instead of anonymous method (on). Same check as SA1130 (default-on there).
  RCS1098: planned | Constant values should be placed on right side of comparisons (on). Same direction as SA1131.
  "RCS1081": "planned | Split variable declaration (off): `int a, b;`. SA1132 is on by default and also covers fields (RCS1081 locals only: unverified)."
  RCS1052: planned | Declare each attribute separately (off).
  RCS0016: formatter
  RCS1025: formatter
  RCS0031: formatter
  RCS0029: option csharp.format.constructor_initializer_line
  RCS0034: formatter
