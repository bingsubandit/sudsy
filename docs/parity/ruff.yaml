tool: "ruff"
version: "0.17.4 (released 2026-11)"
languages: ["python"]
sources:
  - "https://pypi.org/project/ruff/"
  - "https://docs.astral.sh/ruff/formatter/"
  - "https://docs.astral.sh/ruff/formatter/black/"
  - "https://docs.astral.sh/ruff/settings/#format"
scope: "Formatter (`ruff format`, Black's style) and ruff's lint rules: the default set (`F`, `E4`, `E7`, `E9`) and the most used rules of `B`, `C4`, `PIE`, `SIM`, `T20`, `UP` and `W`; the other families are added by usage"
entries:
  line-length: option python.format.line_width
  indent-width: option python.format.indent_size
  indent-style: option python.format.indent_style
  quote-style: option python.format.quote_style
  skip-magic-trailing-comma: option python.format.magic_trailing_comma
  line-ending: option python.format.end_of_line
  docstring-code-format: planned
  docstring-code-line-length: planned
  preview: wontfix preview style is not planned
  exclude: formatter
  E401: rule multiple-imports-on-one-line
  E402: rule module-import-not-at-top-of-file
  E701: rule multiple-statements-on-one-line-colon
  E702: rule multiple-statements-on-one-line-semicolon
  E703: rule useless-semicolon
  E711: rule none-comparison
  E712: rule true-false-comparison
  E713: rule not-in-test
  E714: rule not-is-test
  E721: rule type-comparison
  E722: rule bare-except
  E731: rule lambda-assignment
  E741: rule ambiguous-variable-name
  E742: rule ambiguous-class-name
  E743: rule ambiguous-function-name
  E902: wontfix an unreadable file is reported by the command line, not by a rule
  E999: rule syntax-error
  F401: rule unused-import
  F402: rule import-shadowed-by-loop-var
  F403: rule undefined-local-with-import-star
  F404: rule late-future-import
  F405: rule undefined-local-with-import-star-usage
  F406: rule undefined-local-with-nested-import-star-usage
  F407: rule future-feature-not-defined
  F501: rule percent-format-invalid-format
  F502: rule percent-format-expected-mapping
  F503: rule percent-format-expected-sequence
  F504: rule percent-format-extra-named-arguments
  F505: rule percent-format-missing-argument
  F506: rule percent-format-mixed-positional-and-named
  F507: rule percent-format-positional-count-mismatch
  F508: rule percent-format-star-requires-sequence
  F509: rule percent-format-unsupported-format-character
  F521: rule string-dot-format-invalid-format
  F522: rule string-dot-format-extra-named-arguments
  F523: rule string-dot-format-extra-positional-arguments
  F524: rule string-dot-format-missing-arguments
  F525: rule string-dot-format-mixing-automatic
  F541: rule f-string-missing-placeholders
  F601: rule no-duplicate-keys
  F602: rule no-duplicate-keys
  F621: wontfix ruff does not report it
  F622: rule multiple-starred-expressions
  F631: rule assert-tuple
  F632: rule is-literal
  F633: rule invalid-print-syntax
  F634: rule if-tuple
  F701: rule break-outside-loop
  F702: rule continue-outside-loop
  F704: rule yield-outside-function
  F706: rule return-outside-function
  F707: rule default-except-not-last
  F722: rule forward-annotation-syntax-error
  F811: rule redefined-while-unused
  F821: rule undefined-name
  F822: rule undefined-export
  F823: rule undefined-local
  F841: rule unused-variable
  F842: rule unused-annotation
  F901: rule raise-not-implemented
