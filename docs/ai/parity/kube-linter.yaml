tool: "kube-linter"
version: "0.8.3"
languages: ["yaml"]
rule-url: none
sources:
  - "https://github.com/stackrox/kube-linter/releases/tag/v0.8.3"
  - "https://docs.kubelinter.io/#/generated/checks"
entries:
  no-read-only-root-fs: "rule kubernetes-no-read-only-root-fs"
  run-as-non-root: "rule kubernetes-run-as-non-root"
  unset-memory-requirements: "rule kubernetes-unset-memory-requirements"
  unset-cpu-requirements: "rule kubernetes-unset-cpu-requirements"
  latest-tag: "rule kubernetes-latest-tag"
  mismatching-selector: "planned | a check of the default set not built yet"
  no-extensions-v1beta: "rule kubernetes-no-extensions-v1beta"
  liveness-port: "planned | a check of the default set not built yet"
  readiness-port: "planned | a check of the default set not built yet"
  startup-port: "planned | a check of the default set not built yet"
  drop-net-raw-capability: "rule kubernetes-drop-net-raw-capability"
  privilege-escalation-container: "rule kubernetes-privilege-escalation"
  host-network: "rule kubernetes-host-namespace"
  env-var-secret: "planned | a check of the default set not built yet"
  privileged-container: "rule kubernetes-privileged-container"
  deprecated-service-account-field: "planned | a check of the default set not built yet"
  sensitive-host-mounts: "planned | a check of the default set not built yet"
  host-pid: "rule kubernetes-host-namespace"
  host-ipc: "rule kubernetes-host-namespace"
  docker-sock: "planned | a check of the default set not built yet"
  duplicate-env-var: "planned | a check of the default set not built yet"
  no-anti-affinity: "planned | convention"
  job-ttl-seconds-after-finished: "rule kubernetes-job-ttl-seconds-after-finished"
  pdb-unhealthy-pod-eviction-policy: "planned | convention"
  dangling-service: "wontfix env: reads other objects of the project: a per-file run reports it for every Service or serviceAccount defined in another file"
  non-existent-service-account: "wontfix env: reads other objects of the project: a per-file run reports it for every Service or serviceAccount defined in another file"
