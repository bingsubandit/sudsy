tool: "sqlfluff"
version: "4.5.0 (released 2026-10-30)"
languages: ["sql"]
sources:
  - "https://pypi.org/project/sqlfluff/"
  - "https://docs.sqlfluff.com/en/stable/reference/rules.html"
  - "https://docs.sqlfluff.com/en/stable/configuration/layout.html"
  - "https://docs.sqlfluff.com/en/stable/configuration/default_configuration.html"
scope: "Formatter (`sqlfluff fix` with the layout (LT) and capitalisation (CP) rules, our own layout code and parser); the linter covers the rules that catch bugs (aliasing, ambiguous, convention, structure) and plans the rest; templated rules (JJ) and T-SQL ones (TQ) are out"
entries:
  LT01: formatter
  LT02: formatter
  LT03: formatter
  LT06: formatter
  LT07: formatter
  LT08: formatter
  LT09: formatter
  LT10: formatter
  LT11: formatter
  LT13: formatter
  LT14: formatter
  LT15: formatter
  LT04: option sql.format.comma_position
  LT05: option sql.format.line_width
  CP01: option sql.format.keyword_case
  CP02: option sql.format.identifier_case
  CP03: option sql.format.function_case
  CP04: option sql.format.literal_case
  CP05: option sql.format.type_case
  LT12: option sql.format.final_newline
  AL01: rule implicit-alias
  AL02: rule implicit-alias
  AL04: rule duplicate-table-alias
  AL09: rule self-alias
  AM01: rule distinct-group-by
  AM02: rule union-distinct
  CV02: rule prefer-coalesce
  CV04: rule count-star
  CV05: rule null-comparison
  CV08: rule right-join
  ST01: rule else-null
  ST03: rule unused-cte
  AL03: planned
  AL05: planned
  AL06: planned
  AL07: planned
  AL08: planned
  AM03: planned
  AM04: planned
  AM05: planned
  AM06: planned
  AM07: planned
  CV01: planned
  CV03: planned
  CV06: planned
  CV07: planned
  CV09: planned
  CV10: planned
  CV11: planned
  CV12: planned
  RF01: planned
  RF02: planned
  RF03: planned
  RF04: planned
  RF05: planned
  RF06: planned
  ST02: planned
  ST04: planned
  ST05: planned
  ST06: planned
  ST07: planned
  ST08: planned
  ST09: planned
  ST10: planned
  ST11: planned
  ST12: planned
  JJ01: deferred | templated SQL is not rendered
  TQ01: deferred | T-SQL naming and batch checks are not scheduled
  TQ02: deferred | T-SQL naming and batch checks are not scheduled
  TQ03: deferred | T-SQL naming and batch checks are not scheduled
  indentation.indent_unit: option sql.format.indent_style
  indentation.tab_space_size: option sql.format.indent_size
  core.dialect: option sql.format.dialect
  AL10: planned
  AM08: planned
  AM09: planned
  CV13: planned
  OR01: planned
  PG01: planned
  PG02: planned
  RF07: planned
  TQ04: planned
deferred:
  - gap: "Not exposed as an option."
    ids: [core.max_line_length]
  - gap: "Not exposed as an option until a preset needs it."
    ids: [indentation.indented_joins, indentation.indented_ctes, indentation.indented_using_on, indentation.indented_on_contents, indentation.indented_then, indentation.indented_then_contents, indentation.implicit_indents, indentation.skip_indentation_in, indentation.ignore_comment_lines, indentation.trailing_comments, layout.type, rules.capitalisation.ignore_words, rules.capitalisation.extended_capitalisation_policy]
  - gap: "Templated SQL (Jinja, dbt) is not rendered: a file with template tags does not parse and is refused."
    ids: [core.templater]
