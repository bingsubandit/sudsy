tool: "ansible-lint"
version: "26.11.1"
languages: ["yaml"]
rule-url: none
sources:
  - "https://pypi.org/project/ansible-lint/26.11.1/"
  - "https://ansible.readthedocs.io/projects/lint/rules/"
entries:
  "fqcn[action-core]": "rule ansible-module-fqcn"
  "fqcn[action]": "wontfix env: module name of an installed collection: the name to FQCN table comes from the collections (94 installed in the full run); none without them"
  "fqcn[canonical]": "wontfix env: alias of a module renamed in a collection"
  "name[missing]": "rule ansible-task-name-missing"
  "name[casing]": "rule ansible-task-name-casing"
  "name[template]": "planned | Jinja in the middle of a name; needs a Jinja tokenizer"
  "name[play]": "planned | play without name; 8 of 19 in a test fixture of ansible-navigator"
  "var-naming[no-role-prefix]": "rule ansible-role-var-prefix"
  "var-naming[pattern]": "planned | name against ^[a-z_][a-z0-9_]*$"
  "var-naming[read-only]": "planned | set_fact of a reserved name"
  "var-naming[no-reserved]": "planned | name of a Python keyword or playbook keyword; data: list from ansible-core"
  "yaml[truthy]": "rule ambiguous-booleans"
  "yaml[indentation]": "rule block-indentation"
  "yaml[line-length]": "rule max-line-length"
  "yaml[brackets]": "planned | yamllint braces/brackets, one space inside braces allowed, none in brackets"
  "yaml[colons]": "planned | yamllint colons"
  "yaml[octal-values]": "rule no-octal-values"
  "yaml[comments]": "rule comment-space"
  "yaml[trailing-spaces]": "rule no-trailing-whitespace"
  "yaml[empty-lines]": "planned | yamllint empty-lines"
  "yaml[new-line-at-end-of-file]": "planned | yamllint new-line-at-end-of-file"
  no-changed-when: "rule ansible-command-changed-when"
  no-free-form: "rule ansible-no-free-form"
  risky-file-permissions: "planned | file, copy, template ... without mode or with an unquoted octal; module table"
  "jinja[spacing]": "planned | warn-list by default in ansible-lint; spacing of {{ }} and operators: needs a Jinja tokenizer (a formatter of expressions for the fix)"
  "jinja[invalid]": "planned | Jinja syntax error; needs a Jinja parser"
  "key-order[task]": "planned | name first, block/rescue/always last; keys are facts of the file"
  ignore-errors: "planned | ignore_errors: true without a reason; advice of the tool"
  "role-name[path]": "planned | role: with a path in it; 67 findings in one project (kubespray)"
  risky-shell-pipe: "planned | shell string with a pipe and no pipefail; needs the shell parser (shell leg exists)"
  internal-error: "wontfix bug: ansible-playbook --syntax-check exits 1 and the tool reports its own failure"
  "syntax-check[specific]": "wontfix env: ansible-playbook --syntax-check: roles not found, undefined or invalid keywords; needs ansible-core and the roles installed"
  "syntax-check[unknown-module]": "wontfix env: module of a collection that is not installed (75 without the collections, 1 with them)"
  "args[module]": "wontfix env: module argument specs of installed collections (required, choices, types); no collection no finding"
  "schema[meta]": "planned | JSON schema of meta/main.yml (min_ansible_version must be a string); schema data"
  "schema[tasks]": "planned | JSON schema of tasks (become_method values, `include` removed); schema data"
  "schema[role-arg-spec]": "planned | JSON schema of argument_specs.yml"
  "schema[meta-runtime]": "planned | JSON schema of meta/runtime.yml"
  command-instead-of-shell: "planned | shell without a shell feature"
  command-instead-of-module: "planned | git, systemctl, curl ... in command; module table"
  no-handler: "planned | when: x.changed"
  package-latest: "planned | state: latest of a package module"
  "latest[git]": "planned | git with version: HEAD"
  literal-compare: "planned | == true"
  no-jinja-when: "planned | when with {{ }}"
  deprecated-local-action: "planned | local_action"
  deprecated-module: "wontfix env: list of deprecated modules from the installed collections"
  "partial-become[task]": "planned | become_user without become"
  "run-once[task]": "planned | run_once with the free strategy"
  meta-incorrect: "planned | default galaxy_info values left (company, author)"
  meta-no-tags: "planned | galaxy_tags format"
  "meta-runtime[unsupported-version]": "wontfix env: requires_ansible against the versions supported today (date dependent)"
  "complexity[tasks]": "planned | more than 100 tasks"
  "warning[outdated-tag]": "wontfix env: tag of a rule that was renamed"
