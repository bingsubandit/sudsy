# Rows of the README "Language support" table (xtask/full/src/support.rs): the reference tools per
# language; the primary tool of each list (`primary: true`, else the first) decides `Ready` and is listed first. `tool` is a folder of tests/parity; `groups` limits a folder shared by several languages
# to the ratchet groups of this one. No `format` list: Sudsy does not format the language, or no reference formatter exists and `stability` names
# the groups of tests/parity/stability that stand for the format leg (`scripts/parity.sh stability <group>`). `ids` are the
# language ids of the row (the first is its page slug, every language must be in one row), `speed` the
# language names of its rows in bench/speed.json.
# `requires` is one sentence the site shows on the language page.
# `popularity` orders every language list (README tables, docs/languages.md, the site; ready rows first, then the others,
# each by popularity): one member per language of the row with the raw values of the two sources of languages.yaml (the
# demand formula, xtask/full/src/newlang.rs `demand`); the row takes its most popular member. A source that does not list a
# language has no value and the demand is an estimate (by the other source x 2.27; neither source: 0.1).
#     gh = GitHub Innovation Graph languages.csv (github/innovationgraph, data/languages.csv), pushers of 2026 Q2 summed over
#          economies, top HTML 8,329,335; several linguist names of one family are summed (SQL: SQL + PLpgSQL + TSQL + PLSQL +
#          SQLPL + HiveQL).
#     so = Stack Overflow Developer Survey 2026 (survey.stackoverflow.co/2026/technology/data), % of the 13,924 respondents who
#          answered "languages worked with" (count of the page / 13,924), top JavaScript 62.8; HTML and CSS are one answer
#          (HTML/CSS), Shell is "Bash/Shell (all shells)"; the tool lists of the survey ("cloud platforms and tools"): Docker /
#          Docker Compose, Terraform, Make, CMake; web frameworks: Vue.js, Angular, Svelte.
# `estimate: {value, basis}` of a member replaces the demand where no source lists the format (data formats): set by hand, always
#     marked an estimate. Only rows of support.yaml use it; the new-language scores of languages.yaml keep the formula.
# `exempt: true` and `evidence: <folder>`: a leg with no reference tool. A new language's leg needs `evidence` (a folder of
#     tests/parity with `agreement` for the format leg beside `stability`, `checklist` and `precision` for the lint leg) and is
#     Ready at stable 100% and agreement 80%, checklist 85% and precision 90% (docs/ai/development/no-reference-tool.md);
#     the five legs that predate it (INI, EditorConfig, .gitignore, Dockerfile, GitHub Actions format) are `exempt`.
# `section` is the heading of the section of docs/languages.md of rows that share one (default: the row's `language`).
# `popular: true` (a widely used secondary tool, weight 1) and `blocked: <reason>` (the leg waits on a user decision) feed the priority table of docs/ai/parity/queue.md.
