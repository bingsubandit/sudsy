# Languages and file formats Sudsy does not support yet, or supports with one leg missing: the data of the new-language
# rows of docs/ai/parity/queue.md (xtask/full/src/newlang.rs). A language with a row in support.yaml takes only its missing
# leg and no `parser` (paid); its `gh` and `so` are the `popularity` of that row. `deferred: [format|lint]` drops a leg the user put off.
#
# A number written "~0.6" is an estimate (the first measuring replaces it); a plain number is measured.
# Score of a plan (lint, format, both) = 4 x 85 x Demand x sum(Gain) / (20 x (Parser + sum Cost)). Every plan is assumed to
# reach the 85% bar and everything it takes is in the Cost; findings that need running user code and bugs of the tool are
# excluded from the target and are no cost. An entry with an estimate may only be picked to measure it.
# One primary tool per leg (a list of tools fails codegen): the tool most users run for that use case, chosen by usage evidence
# (package downloads, stars, config files in public repositories, the language's own documentation), recorded first in `why`.
# The look-ups of 2026-11-25 are npm and PyPI downloads of a month, Homebrew installs of 30 days, CRAN downloads, GitHub stars.
#   Gain: 0.1 official or de facto standard, native and fast, ships with the language; 0.4 good and fast third party
#         (native binary); 0.7 slow or needs its own runtime (JVM, BEAM, Node, Python, Ruby, the language's toolchain);
#         1.0 none or poor ("none found": no maintained tool; the leg is held to docs/ai/development/no-reference-tool.md).
#   Cost of a leg, named parts in `cost` (xtask/full/src/newlang.rs `Cost`): base 1.0; `types: true` a type worker +0.3
#         (lint that reads types); `index: true` a project or symbol index +0.2; `parts: N` each missing shared part +0.1;
#         `layout` of a format leg: whitespace -0.3 (only blanks change), width +0.2, penalty +0.5 (choice by penalties),
#         none for a canonical layout; `est: true` marks the parts as estimates. A leg with no tool: lint `parts: 3`
#         (checklist from the specification, rules, judged precision), format `layout: width, parts: 1` (decision table).
#   Parser: 1.0 good Rust crate, +0.2 tree-sitter (a grammar that exists; stars and last push are in the comment), +0.5
#           hand-written (no grammar or crate found); 0.2 when the format sits on a parser Sudsy has (YAML, JSON, XML,
#           Markdown, Python): only a semantic layer is new; 0 when paid.
#   Demand 0.1-1, computed from the raw values `gh` and `so` of the entry: per source sqrt(x / top of that source), the
#     mean of the two, floored at 0.1 (xtask/full/src/newlang.rs, `demand`).
#     gh = GitHub Innovation Graph languages.csv (github/innovationgraph, data/languages.csv), pushers of 2026 Q2 summed over
#          economies, top HTML 8,329,335; several linguist names of one family are summed (Jinja + Nunjucks).
#     so = Stack Overflow Developer Survey 2026 (survey.stackoverflow.co/2026, response data CSV), % of the 13,924 respondents
#          who answered "languages worked with", top JavaScript 62.8; the tool list of the survey ("dev environments and build
#          tools": CMake, Gradle, Ansible, Helm, Kubernetes, Bazel, Ninja, Docker Compose) on the same base.
#     A language with a row in support.yaml keeps its `gh` and `so` there (`popularity`), not here.
#     A language listed by one source only: the other is estimated as the listed one x 2.27 (survey over pushers), the median
#          over the 42 languages both list of sqrt(so / 62.8) / sqrt(gh / 8,329,335); the demand shows "~". In neither: 0.1, "~".
# `retrofit: true` marks the six existing legs with no reference tool (INI, EditorConfig, .gitignore, Dockerfile, Makefile and
# GitHub Actions format): scored like any leg (parser paid), they keep their Ready state; `support` names the row of a language
# that shares one. Their cost is what docs/ai/development/no-reference-tool.md still asks of them.
# Inclusion: every language of the Innovation Graph with at least 20,000 pushers, every language of the survey, and every
# language or format named by a formatter or linter list (conform.nvim, mega-linter, pre-commit, dprint plugins, linguist
# data and markup types with a tool) or by the task; not the ones support.yaml already holds with both legs. A tool was looked
# up (repository exists, last push, archived) on 2026-11-24, a parser too (grammar repository, crate on crates.io).

